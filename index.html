<!doctype html>
<!-- Sistema de Control de Proyectos · estructura de la página (MOD-13) -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121212">
<title>Control de Proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   MOD-11 · MARCA Y ESTILOS
   Sistema de Control de Proyectos
   Secciones:
     MOD-11.1 Colores corporativos (rojo y negro) y modo oscuro
     MOD-11.2 Tipografía
     MOD-11.3 Componentes (barra, botones, tarjetas, tablas, chips, formularios)
     MOD-11.4 Diagrama de Gantt
     MOD-11.5 Pantalla de ingreso y bienvenida
     MOD-11.6 Ajustes para celular
   Regla de cambio: un cambio de colores o tipografía solo se hace aquí.
   ===================================================================== */

/* ---------- MOD-11.1 Colores corporativos ---------- */
:root{
  --rojo:#c8102e; --rojo-osc:#9e0c24; --rojo-suave:#fbe3e7;
  --negro:#121212; --negro-2:#1d1d1d;
  --bg:#f3f3f3; --surface:#ffffff; --surface-2:#f7f7f7; --ink:#141414; --muted:#5f5f5f; --line:#d9d9d9; --line-2:#ececec;
  --accent:var(--rojo); --accent-ink:#ffffff; --accent-soft:var(--rojo-suave);
  --bar:var(--negro); --bar-ink:#ffffff; --bar-muted:#b5b5b5;
  --real:#1a1a1a;
  --ok:#2b7a37; --ok-soft:#dcefdf; --warn:#9b6200; --warn-soft:#f5e7c9; --crit:#c8102e; --crit-soft:#fbe3e7;
  --info:#3b4a63; --info-soft:#e4e8ef; --idle:#6b6b6b; --idle-soft:#ececec;
  --we:rgba(0,0,0,.04); --today:#c8102e; --shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);
  --f-display:'Saira Condensed','Arial Narrow',Arial,sans-serif; --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#161616; --surface-2:#1d1d1d; --ink:#ececec; --muted:#a3a3a3; --line:#2e2e2e; --line-2:#242424;
  --accent:#e3263f; --accent-ink:#ffffff; --accent-soft:#3a1016; --real:#f0f0f0;
  --ok:#62c070; --ok-soft:#1a3320; --warn:#e2a843; --warn-soft:#3a2c12; --crit:#ff4d61; --crit-soft:#3a1016;
  --info:#a9b6cc; --info-soft:#232a36; --idle:#9a9a9a; --idle-soft:#262626; --we:rgba(255,255,255,.035); --today:#ff4d61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#161616; --surface-2:#1d1d1d; --ink:#ececec; --muted:#a3a3a3; --line:#2e2e2e; --line-2:#242424;
  --accent:#e3263f; --accent-ink:#ffffff; --accent-soft:#3a1016; --real:#f0f0f0;
  --ok:#62c070; --ok-soft:#1a3320; --warn:#e2a843; --warn-soft:#3a2c12; --crit:#ff4d61; --crit-soft:#3a1016;
  --info:#a9b6cc; --info-soft:#232a36; --idle:#9a9a9a; --idle-soft:#262626; --we:rgba(255,255,255,.035); --today:#ff4d61; color-scheme:dark}

/* ---------- MOD-11.2 Tipografía ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.mono,.num,.wbs,td.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- MOD-11.3 Componentes ---------- */
.bar{position:sticky;top:0;z-index:8;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--rojo)}
.bar-in,.tabs,main,#banner,.foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 320px}
.mark{flex:none;width:36px;height:36px;border-radius:6px;background:var(--rojo);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em}
.brand-txt{min-width:0;flex:1}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.bar .eyebrow{color:var(--bar-muted)}
#projSel{font-family:var(--f-display);font-size:20px;font-weight:600;border:0;background:transparent;color:var(--bar-ink);padding:0 22px 0 0;max-width:100%;text-overflow:ellipsis;cursor:pointer}
#projSel option{color:#141414}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .btn{background:transparent;color:var(--bar-ink);border-color:#444}
.bar .btn.primary{background:var(--rojo);border-color:var(--rojo);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-weight:600;color:var(--bar-muted);border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;cursor:pointer}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--rojo)}
.tab .cnt{font-size:11px;background:var(--rojo);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px;font-weight:700}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid #444;border-radius:999px;padding:3px 4px 3px 12px;color:var(--bar-ink)}
#banner{background:var(--warn-soft);color:var(--ink);padding-block:9px;border-bottom:1px solid var(--line);font-size:13px}
main{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px;max-width:1500px;margin:0 auto}
.foot{padding-block:14px 30px;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.modtag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:700;background:var(--negro);color:#fff;border-left:3px solid var(--rojo);border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:3px;letter-spacing:.02em}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--rojo-osc)}
.btn.dark{background:var(--negro);border-color:var(--negro);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:4px 9px;min-height:28px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--negro);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h2,.sec-h h2{font-size:19px}
.card>h2{margin-bottom:12px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
.toolbar select,.toolbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;min-height:36px;max-width:100%}
.muted{color:var(--muted)} .small{font-size:12.5px} .hint{font-size:12px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}
.t-crit{color:var(--crit)} .t-ok{color:var(--ok)} .t-warn{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--negro);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .num{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05}
.kpi .num.sm{font-size:22px;padding-block:6px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.crit{border-top-color:var(--crit);background:var(--crit-soft)}
.kpi.warn{border-top-color:var(--warn);background:var(--warn-soft)}
.kpi.big{grid-column:span 2;border-top-color:var(--rojo)}
button.kpi{cursor:pointer;font:inherit}
@media (max-width:520px){.kpi.big{grid-column:auto}}
.meter{position:relative;height:10px;background:var(--line-2);border-radius:5px;margin-top:4px}
.meter>span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.meter>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.meter.sm{height:7px}
.meter.sm>i{top:-3px;bottom:-3px}

.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--negro);color:#fff} .chip.idle{background:var(--idle-soft);color:var(--idle)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#fff;font-weight:700;padding:9px 10px;background:var(--negro);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.n{text-align:right;white-space:nowrap}
.tbl td.nw{white-space:nowrap}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .t{font-weight:600}
.li .m{font-size:12.5px;color:var(--muted)}
.li .r{text-align:right;flex:none;font-size:12.5px}
.li.click{cursor:pointer}
.fb{display:flex;flex-direction:column;gap:3px;padding:7px 0}
.fb-h{display:flex;align-items:center;gap:8px}
.fb-n{flex:1;font-weight:600;min-width:0}
.fb-v{font-family:var(--f-mono);font-size:13px}
.fb-s{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--c)}
.legend i.d{border-top-style:dashed}
.prepbar{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px}
.prepbar .meter{width:54px;margin:0}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details{border-top:1px solid var(--line-2);padding:8px 0}
details summary{cursor:pointer}

.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:13px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard .nm{font-weight:600;line-height:1.3}
.tcard .meta{font-size:12.5px;color:var(--muted)}
.tcard .pv{display:flex;align-items:center;gap:10px}
.tcard .pv .meter{flex:1;margin:0}
.tcard .pv b{font-family:var(--f-mono);font-size:14px;min-width:42px;text-align:right}
.tcard .btn{justify-content:center;min-height:44px}
.who{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rojo);border-radius:8px;padding:12px 14px}

#modal,#auth{position:fixed;inset:0;z-index:30}
#auth{z-index:45}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.dlg{background:var(--surface);border-radius:10px;width:100%;max-width:720px;box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line);border-top:4px solid var(--rojo)}
.dlg.wide{max-width:980px}
.dlg.sm{max-width:420px}
.dlg>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg>header h3{font-size:21px}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.dlg>footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;position:sticky;bottom:0}
.dlg>footer .sp{flex:1}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld .req{color:var(--crit);font-style:normal}
.fld input:not([type=checkbox]):not([type=range]),.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
.fld textarea{resize:vertical;min-height:72px}
.fld.chk label{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:flex-start}
.deps{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.deps label{display:flex;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.deps .g{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:6px}
.err{color:var(--crit);font-weight:600;margin:0;grid-column:1/-1}
.prog{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog input[type=range]{flex:1;min-width:160px;accent-color:var(--rojo)}
.prog input[type=number]{width:84px!important}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.subsec h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px;font-weight:600}
.ro-note{background:var(--info-soft);color:var(--info);padding:8px 12px;border-radius:6px;font-size:13px}
.risk-h,.risk-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 62px 74px;gap:6px}
.risk-h{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.risk-row{align-items:start;border-bottom:1px solid var(--line-2);padding:8px 0}
.risk-row textarea{min-height:52px!important}
.risk-row select{min-height:36px!important;padding:4px!important}
.risk-row .npr{font-family:var(--f-mono);text-align:center;padding-top:8px}
.risk-row .ctl{grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--negro);color:#fff;border-left:4px solid var(--rojo);padding:10px 16px;border-radius:6px;font-weight:600;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- MOD-11.4 Diagrama de Gantt ---------- */
.gantt{--lw:920px;--gcols:44px minmax(0,1fr) 140px 58px 58px 58px 62px 96px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.g-scroll{overflow:auto;max-height:74vh;position:relative}
.g-head,.g-row,.g-grp{display:flex}
.g-head{position:sticky;top:0;z-index:6;background:var(--negro);color:#fff}
.g-left{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;display:grid;grid-template-columns:var(--gcols);align-items:center;gap:0 8px;padding:0 10px;background:var(--surface);border-right:1px solid var(--line)}
.g-head .g-left{background:var(--negro);z-index:7;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;font-weight:700;height:46px;border-right-color:#333}
.g-th{position:relative;flex:none;height:46px}
.mh{position:absolute;top:0;height:22px;line-height:22px;padding-left:6px;font-size:11.5px;font-weight:700;color:#fff;border-left:1px solid #444;white-space:nowrap;overflow:hidden;text-transform:capitalize}
.dh{position:absolute;top:22px;height:24px;line-height:24px;font-size:10.5px;color:#bbb;text-align:center;border-left:1px solid #333;font-family:var(--f-mono)}
.dh.we{color:#ff8a98}
/* v2.1.1 (SC-2026-007): filas de alto variable; el nombre completo se muestra en varias líneas */
.g-row{min-height:40px;border-bottom:1px solid var(--line-2);cursor:pointer}
.g-row .g-left{padding-block:7px}
.g-row:hover .g-left,.g-row:hover .g-tl{background-color:var(--surface-2)}
.g-grp{height:34px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:pointer}
.g-grp .g-left{background:var(--surface-2);font-weight:700;grid-template-columns:22px minmax(0,1fr) auto}
.g-tl{position:relative;flex:none;align-self:stretch;min-height:40px;background-image:linear-gradient(90deg,transparent var(--wkS),var(--we) var(--wkS));background-size:var(--wkW) 100%;background-position:var(--wkO) 0}
.gantt.month .g-tl{background-image:none}
.g-left .wbs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.g-left .nm{white-space:normal;overflow-wrap:anywhere;line-height:1.3;font-weight:500}
.g-grp .g-left .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-left .rs{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.g-left .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.g-left .dt{font-family:var(--f-mono);font-size:11.5px}
.g-left .pc,.g-left .dl{font-family:var(--f-mono);font-size:12px;text-align:right}
.g-left .dl.on{color:var(--crit);font-weight:700}
.g-left .pt{font-size:10px;font-weight:700;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.bar-p{position:absolute;top:calc(50% - 10px);height:20px;border-radius:4px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid var(--c);overflow:hidden}
.bar-p>span{position:absolute;inset:0 auto 0 0;background:var(--c)}
.bar-p.crit{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.bar-o{position:absolute;top:calc(50% - 4px);height:8px;border-radius:0 4px 4px 0;background:repeating-linear-gradient(135deg,var(--crit) 0 3px,transparent 3px 6px);opacity:.85}
.bar-l{position:absolute;top:calc(50% - 9px);font-size:11.5px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.bar-g{position:absolute;top:13px;height:8px;border-radius:2px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.bar-g>span{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:2px}
.g-arrows{position:absolute;top:0;z-index:2;pointer-events:none;overflow:visible}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:3;pointer-events:none}
.g-today b{position:absolute;top:2px;left:4px;font-size:10px;color:var(--today);font-family:var(--f-mono)}

/* ---------- MOD-11.5 Pantalla de ingreso y bienvenida ---------- */
#gate{position:fixed;inset:0;z-index:60;background:var(--negro);color:#fff;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-in .mark{width:54px;height:54px;font-size:21px;border-radius:10px}
.gate-in h1{font-size:28px;line-height:1.1}
.gate-in .eyebrow,.gate-in .hint,.gate-in .muted{color:#b5b5b5}
.gate-in select{width:100%;min-height:46px;border-radius:8px;border:1px solid #444;background:#1d1d1d;color:#fff;padding:8px 12px;font-size:16px}
.dots{display:flex;gap:12px;margin:8px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--rojo);display:block}
.dots i.on{background:var(--rojo)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:6px}
.pad button{min-height:60px;border-radius:10px;border:1px solid #3a3a3a;background:#1d1d1d;color:#fff;font-family:var(--f-display);font-size:26px;font-weight:600;cursor:pointer}
.pad button:active{background:#2a2a2a}
.pad button.ok{background:var(--rojo);border-color:var(--rojo);font-size:17px}
.gate-in .err{color:#ff8a98}
/* MOD-01.6 Instalación inicial (v4.0.0) */
.gate-in .frm{align-self:stretch;width:100%;text-align:left}
.gate-in .fld>label{color:#b5b5b5}
.gate-in .fld input:not([type=checkbox]):not([type=range]){background:#1d1d1d;color:#fff;border-color:#444;font-size:16px;min-height:46px;border-radius:8px}
.gate-in .fld input:focus{border-color:var(--rojo,#c8102e);outline:2px solid rgba(200,16,46,.35)}
.welcome h1{font-size:32px}
.wl{font-size:18px;margin:0}
.wl.strong{font-family:var(--f-display);font-size:26px;font-weight:600;color:#ff4d61}

/* ---------- MOD-11.6 Ajustes para celular ---------- */
@media (max-width:760px){
  .gantt{--lw:250px;--gcols:40px minmax(0,1fr) 40px}
  .g-left .rs,.g-left .dt,.g-left .dl,.g-left .st,.g-head .hx{display:none}
}
/* v2.1.4 (SC-2026-012): barra superior compacta en celular */

  .bar-in{gap:8px;padding-block:8px}

  .bar-actions{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}
  .bar-actions::-webkit-scrollbar{display:none}
  .bar-actions .btn{min-height:34px;padding:5px 10px;font-size:13px;flex:none}

<script>
/* ===== js/mod13-nucleo.js ===== */
/* =====================================================================
   MOD-13 · NÚCLEO: UTILIDADES, CÁLCULO, VENTANAS Y NAVEGACIÓN
   Secciones:
     MOD-13.1 Utilidades (fechas, texto, identificadores)
     MOD-13.2 Catálogos y constantes (estados, sedes, tipos)
     MOD-13.3 Estado de la aplicación y selección de datos
     MOD-13.4 Cálculo del cronograma (avance plan/real, retraso, pronóstico, KPI)
     MOD-13.5 Dibujo de pantallas, barra superior, pestañas y pie
     MOD-13.6 Ventanas, formularios y formulario genérico de registros
     MOD-13.7 Eventos (clics, filtros) y arranque
   Regla de cambio: los módulos de pantalla (MOD-02 a MOD-09) registran sus
   vistas en VIEWS y sus acciones en ACT; no se editan aquí.
   ===================================================================== */

/* ---------- MOD-13.1 Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dn=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);if(!y)return null;return Math.round(Date.UTC(y,m-1,d)/864e5)};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
let today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const TD=()=>dn(today());
const fmt=s=>{if(!s)return '—';const[y,m,d]=String(s).split('-');return `${+d} ${MES[m-1]}`};
const fmtY=s=>{if(!s)return '—';const[y,m,d]=String(s).split('-');return `${+d} ${MES[m-1]} ${y}`};
const dow=n=>new Date(n*864e5).getUTCDay();
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pct=n=>Math.round(n);
const nowISO=()=>new Date().toISOString();
const slug=s=>String(s||'proyecto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'').slice(0,50);
function descargar(nombre,contenido,tipo){const b=new Blob([contenido],{type:tipo||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Archivo descargado: '+nombre)}

/* ---------- MOD-13.2 Catálogos y constantes ---------- */
const PAL=['#3f5a7a','#b5651d','#2e7d6b','#a8830a','#6a4c93','#2b6cb0','#a23b5a','#5b8c2a','#8a5a44','#0f7c8c','#7d6b20','#9c4a2b','#3d5a99','#74706a','#4f7f5f','#8f3f8f'];
const fcol=fi=>PAL[((fi-1)%PAL.length+PAL.length)%PAL.length];
const ST={done:['Completada','ok'],late:['Atrasada','crit'],risk:['En riesgo','warn'],blocked:['Bloqueada','info'],active:['En curso','acc'],pending:['Por iniciar','idle']};
const chip=st=>`<span class="chip ${ST[st][1]}">${ST[st][0]}</span>`;
const SITES=['CD UIO','CD GYE','Cross Docking CUE','Todas las sedes'];
const PTYPES=['Interno','Técnico de mantenimiento','Contratista / Proveedor','Aprobador / Jefatura'];
const ROLES={admin:'Administrador del proyecto',lead:'Líder de avances',member:'Registra avances',viewer:'Solo resumen de avance',none:'Sin acceso'};
const VIEWER_TABS=['tablero','cronograma'];

/* ---------- MOD-13.3 Estado y selección de datos ---------- */
const COLS=['projects','people','tasks','logs','permits','equipment','changes','audit','config'];
const S={data:Object.fromEntries(COLS.map(c=>[c,[]])),loaded:{},pid:lsGet('cp-pid'),view:'tablero',
  f:{front:'',resp:'',site:'',status:'',q:''},zoom:lsGet('cp-zoom')||'week',collapsed:{},techMode:'mine',
  pf:{type:'',status:''},showDeps:true,demo:false,ready:false,g:null,gInit:false,feedAll:false,
  session:null,showCodes:lsGet('cp-codes')==='1'};
const VIEWS={}, ACT={}, VIEWS_LIST=[];   // los módulos de pantalla se registran aquí
const SPEC={};                           // formularios genéricos que registran los módulos
const HOOKS=[];                          // v2.1.0: tareas que los módulos ejecutan antes de cada dibujo (configuración, recordatorios)
const MT=c=>S.showCodes?`<span class="modtag" title="Código para solicitudes de cambio">${c}</span>`:'';
const proj=()=>S.data.projects.find(p=>p.id===S.pid);
const of=col=>S.data[col].filter(x=>x.projectId===S.pid);
const tasksRaw=()=>of('tasks');
function fronts(){const p=proj();const f=[...(p?.fronts||[])];tasksRaw().forEach(t=>{if(t.front&&!f.includes(t.front))f.push(t.front)});return f}
const person=id=>S.data.people.find(p=>p.id===id);
const pname=id=>person(id)?.name||'—';
const pshort=id=>{const n=person(id)?.name;if(!n)return '—';return n.length>22?n.slice(0,21)+'…':n};
const peopleSorted=()=>[...S.data.people].sort((a,b)=>(a.active===false)-(b.active===false)||String(a.name).localeCompare(b.name));
function peopleOpts(val,type){return peopleSorted().filter(p=>(p.active!==false&&(!type||p.type===type))||p.id===val).map(p=>`<option value="${esc(p.id)}" ${p.id===val?'selected':''}>${esc(p.name)}${p.role?' — '+esc(p.role):''}</option>`).join('')}
function taskOpts(val,filterFn){const fr=fronts();return fr.map((f,i)=>{const cs=C.list.filter(c=>c.t.front===f&&(!filterFn||filterFn(c)));if(!cs.length)return '';return `<optgroup label="${i+1}. ${esc(f)}">${cs.map(c=>`<option value="${esc(c.id)}" ${c.id===val?'selected':''}>${c.wbs} ${esc(c.t.name)} (${c.prog}%)</option>`).join('')}</optgroup>`}).join('')}
const tlabel=id=>{const c=C.map[id];return c?`${c.wbs} ${c.t.name}`:'—'};

/* ---------- MOD-13.4 Cálculo del cronograma ---------- */
let C={list:[],map:{},by:{}};
function compute(){
  const ts=tasksRaw(),by=Object.fromEntries(ts.map(t=>[t.id,t])),T=TD(),fr=fronts();
  const sorted=[...ts].sort((a,b)=>fr.indexOf(a.front)-fr.indexOf(b.front)||(a.order||0)-(b.order||0)||String(a.start).localeCompare(String(b.start)));
  const cnt={};C={list:[],map:{},by};
  for(const t of sorted){
    const fi=fr.indexOf(t.front)+1;cnt[fi]=(cnt[fi]||0)+1;
    const s=dn(t.start)??T,e=Math.max(dn(t.end)??s,s),dur=e-s+1,prog=Math.max(0,Math.min(100,Math.round(+t.progress||0)));
    const planned=T<s?0:T>=e?100:Math.round((T-s+1)/dur*100);
    const delay=prog>=100?(t.actualEnd?Math.max(0,dn(t.actualEnd)-e):0):Math.max(0,T-e);
    const preds=(t.deps||[]).map(i=>by[i]).filter(Boolean);
    const blocked=prog<100&&preds.some(p=>(+p.progress||0)<100)&&T>=s;
    const st=prog>=100?'done':delay>0?'late':blocked?'blocked':T<s?(prog>0?'active':'pending'):(planned-prog>=20?'risk':'active');
    const fe=prog>=100?(t.actualEnd?dn(t.actualEnd):e):(T>=s?Math.max(e,T+Math.ceil(dur*(100-prog)/100)-1):e);
    const c={t,id:t.id,wbs:`${fi}.${cnt[fi]}`,fi,s,e,dur,prog,planned,delay,st,fe,preds};
    C.list.push(c);C.map[t.id]=c;
  }
  // Pronóstico propagado por vínculos: una actividad sin iniciar no termina antes que sus predecesoras
  for(let pass=0;pass<60;pass++){let ch=false;
    for(const c of C.list){if(c.prog>0)continue;const pm=Math.max(-1e9,...c.preds.map(p=>C.map[p.id]?C.map[p.id].fe:-1e9));const fe=Math.max(c.s,pm+1,T)+c.dur-1;if(fe!==c.fe){c.fe=fe;ch=true}}
    if(!ch)break}
}
function kpis(){
  const L=C.list,T=TD(),sd=L.reduce((a,c)=>a+c.dur,0)||1;
  const real=L.reduce((a,c)=>a+c.prog*c.dur,0)/sd,plan=L.reduce((a,c)=>a+c.planned*c.dur,0)/sd;
  const end=L.length?Math.max(...L.map(c=>c.e)):T,fend=L.length?Math.max(...L.map(c=>c.fe)):T,start=L.length?Math.min(...L.map(c=>c.s)):T;
  const late=L.filter(c=>c.st==='late');
  const perms=of('permits').filter(p=>['Planificado','Solicitado'].includes(p.status)&&dn(p.date)!=null&&dn(p.date)<=T+7);
  const incid=of('logs').filter(l=>l.issue&&!l.issueResolved);
  return{n:L.length,real,plan,spi:plan>0?real/plan:1,done:L.filter(c=>c.st==='done').length,active:L.filter(c=>c.st!=='done'&&c.prog>0).length,
    pending:L.filter(c=>c.st==='pending').length,late:late.length,delayDays:late.reduce((a,c)=>a+c.delay,0),risk:L.filter(c=>c.st==='risk').length,blocked:L.filter(c=>c.st==='blocked').length,
    start,end,fend,slip:fend-end,perm:perms.length,permOver:perms.filter(p=>dn(p.date)<T).length,incid:incid.length}
}
function filtered(){const f=S.f,q=f.q.trim().toLowerCase();return C.list.filter(c=>(!f.front||c.t.front===f.front)&&(!f.resp||c.t.respId===f.resp||c.t.contractorId===f.resp)&&(!f.site||c.t.site===f.site)&&(!f.status||c.st===f.status)&&(!q||(c.wbs+' '+c.t.name+' '+(c.t.desc||'')).toLowerCase().includes(q)))}

/* ---------- MOD-13.5 Dibujo de pantallas ---------- */
let rq=false;function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function ensurePid(){const ps=S.data.projects;if(!ps.find(p=>p.id===S.pid)){const s=[...ps].sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));S.pid=s[0]?.id||null}}
function renderBar(){

  sel.innerHTML=ps.length?ps.map(p=>`<option value="${esc(p.id)}" ${p.id===S.pid?'selected':''}>${esc(p.name)}</option>`).join(''):'<option>Sin proyectos</option>';
  const p=proj(),k=C.list.length?kpis():null,u=S.session;
  $('#projMeta').textContent=p?`${p.code||'Proyecto'} · ${k?pct(k.real)+'% avance':'sin actividades'}`:'Proyecto';
  const off=S.offModules||[];
  $('.bar-actions').innerHTML=(!u||isViewer()||off.includes('avances')?'':`<button class="btn primary" data-act="log-new">+ Registrar avance</button>`)+(u&&isAdmin()?'<button class="btn" data-act="task-new">+ Actividad</button>':'')+(u&&p?'<button class="btn" data-act="export-open">Exportar</button>':'')
    +(u?`<span class="userchip"><span><b>${esc(String(u.name||'').split(' ').slice(0,2).join(' '))}</b><span class="rol"> · ${esc(ROLES[u.role]||'')}</span></span><button class="btn sm ghost" data-act="logout">Salir</button></span>`:'');
  const badge={cronograma:k?.late,autorizaciones:k?.permOver,avances:k?.incid};
  $('#tabs').innerHTML=VIEWS_LIST.filter(([id])=>(!isViewer()||VIEWER_TABS.includes(id))&&!off.includes(id)&&(id!=='configuracion'||isAdmin())).map(([id,l])=>`<button class="tab" role="tab" aria-selected="${S.view===id}" data-act="tab" data-id="${id}">${l}${badge[id]?`<span class="cnt">${badge[id]}</span>`:''}</button>`).join('');
  $('#foot').innerHTML=`<span>${esc(SISTEMA.nombre)} · <b>v${esc(SISTEMA.version)}</b> (${fmtY(SISTEMA.fecha)})${S.demo?' · <b class="t-crit">MODO DEMOSTRACIÓN</b>':''}</span><button class="btn sm" data-act="codes-toggle">${S.showCodes?'Ocultar':'Mostrar'} códigos de módulo</button>`;
}
function render(){

  const v=$('#view');
