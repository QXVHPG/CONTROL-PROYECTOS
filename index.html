     MOD-07.1 Registro de controles de cambio
     MOD-07.2 Formulario (formato oficial de Calidad) con evaluación de riesgos S × P × D
   El control de cambios lo gestiona Calidad. Aquí se lleva su seguimiento
   en texto (sin adjuntos). Requisito: ISO 9001:2015 §6.3 y §8.5.6; BPADT.
   Nota: el control de cambios DEL SISTEMA (software) se maneja aparte,
   ver docs/CONTROL_DE_CAMBIOS_SISTEMA.md.
   ===================================================================== */
VIEWS_LIST.push(['cambios','Control de cambios',6]);
const CHG_ST=['Borrador','En revisión','Aprobado','Rechazado','Implementado','Cerrado'];
const CHG_CLS={'Borrador':'idle','En revisión':'warn','Aprobado':'ok','Rechazado':'crit','Implementado':'acc','Cerrado':'info'};
const CC_SCOPE=['Instalaciones','Equipos','Sistemas informáticos','Transporte','Documentación','Proveedores','Subcontratistas','Otros'];
const CC_COMMITTEE=['Calidad','Operación Logística a Terceros','Logística y Distribución','Jefe de Proyectos','Gerencia'];
const YESNA=['Sí','No aplica'];
const nprType=n=>n<=10?['Bajo','ok']:n<=45?['Medio','warn']:['Alto','crit'];

/* MOD-07.1 */
VIEWS.cambios=function(){
  const ch=of('changes').sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  return `<section class="card"><div class="sec-h"><h2>Registro de control de cambios ${MT('MOD-07.1')}</h2><button class="btn sm primary" data-act="chg-new">+ Control de cambio</button></div>
   <p class="hint" style="margin:0 0 10px">Calidad gestiona el control de cambios con el formato oficial de Calidad; aquí se registra su seguimiento: alcance, riesgos (S × P × D), firmas del comité y estado. Requisito: ISO 9001:2015 §6.3 y §8.5.6 y BPADT.</p>
   ${ch.length?`<div class="tw"><table class="tbl"><thead><tr><th>N.º</th><th>Cambio</th><th>Alcance</th><th>Riesgos</th><th>Comité</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${ch.map(c=>{const rk=c.risks||[],hi=rk.filter(r=>r.npr&&r.npr>10).length;return `<tr class="click" data-act="chg-edit" data-id="${esc(c.id)}"><td class="nw mono">${esc(c.code)}</td><td>${esc(c.title)}</td><td>${esc((c.scope||[]).join(', ')||'—')}</td><td class="nw">${rk.length} ${hi?`<span class="chip warn">${hi} medio/alto</span>`:''}</td><td class="n">${(c.committee||[]).length}/${CC_COMMITTEE.length}</td><td class="nw">${fmt(c.date)}</td><td><span class="chip ${CHG_CLS[c.status]||'idle'}">${esc(c.status)}</span></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>Sin cambios registrados</b>Registra el control de cambios del proyecto antes de iniciar.</div>'}</section>
  ${ch.map(c=>(c.risks||[]).length?`<section class="card"><h2>${esc(c.code)} · Matriz de riesgos</h2><div class="tw"><table class="tbl"><thead><tr><th>N.º</th><th>Riesgo</th><th>S</th><th>P</th><th>D</th><th>NPR</th><th>Tipo</th><th>Control</th></tr></thead><tbody>${c.risks.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r.desc)}</td><td class="n">${r.s||''}</td><td class="n">${r.p||''}</td><td class="n">${r.d||''}</td><td class="n"><b>${r.npr||''}</b></td><td>${r.npr?`<span class="chip ${nprType(r.npr)[1]}">${nprType(r.npr)[0]}</span>`:''}</td><td>${esc(r.ctl||'')}</td></tr>`).join('')}</tbody></table></div></section>`:'').join('')}`;
};

/* MOD-07.2 Riesgos S × P × D */
function riskRowHTML(r){r=r||{};const sel=k=>`<select data-r="${k}" aria-label="${k}">${['',1,2,3,4,5].map(n=>`<option ${String(r[k]??'')===String(n)?'selected':''}>${n}</option>`).join('')}</select>`;
  const n=(+r.s||0)*(+r.p||0)*(+r.d||0),ty=n?nprType(n):null;
  return `<div class="risk-row"><textarea data-r="desc" rows="2" placeholder="Descripción del riesgo">${esc(r.desc)}</textarea>${sel('s')}${sel('p')}${sel('d')}<div class="npr"><b>${n||'—'}</b><br>${ty?`<span class="chip ${ty[1]}">${ty[0]}</span>`:''}</div>
   <textarea class="ctl" data-r="ctl" rows="2" placeholder="Control / acción de mitigación">${esc(r.ctl)}</textarea><button type="button" class="btn sm ghost danger" data-rdel style="grid-column:1/-1;justify-self:end">Quitar riesgo</button></div>`}
FIELD_TYPES.risks={
  html:(f,val,id)=>`<div id="${id}"><div class="risk-h"><span>Riesgo y control</span><span>Sev.</span><span>Prob.</span><span>Det.</span><span>NPR</span></div><div class="risk-list">${(val||[]).map(riskRowHTML).join('')}</div><button type="button" class="btn sm" id="${id}_add">+ Agregar riesgo</button><div class="hint">Escala 1–5. NPR ≤ 10 bajo · 11–45 medio · &gt; 45 alto (umbrales a validar con Calidad).</div></div>`,
  read:el=>$$('.risk-row',el).map(r=>{const g=k=>r.querySelector(`[data-r="${k}"]`).value.trim();const o={desc:g('desc'),s:+g('s')||null,p:+g('p')||null,d:+g('d')||null,ctl:g('ctl')};o.npr=(o.s||0)*(o.p||0)*(o.d||0)||null;return o}).filter(r=>r.desc)
};
SPEC.changes={title:'control de cambio',code:'MOD-07.2',wide:1,fields:[{k:'code',l:'N.º de control de cambio',t:'text',req:1,half:1,ph:'CC-24'},{k:'format',l:'Formato',t:'text',half:1},

    {k:'scope',l:'1. Alcance del cambio',t:'checks',o:()=>CC_SCOPE},{k:'current',l:'Situación actual',t:'textarea',rows:5},{k:'description',l:'Situación propuesta',t:'textarea',rows:7},{k:'reason',l:'2. Justificación',t:'textarea',rows:3},{k:'impactText',l:'Áreas impactadas',t:'textarea',rows:3},{k:'benefits',l:'Beneficios',t:'textarea',rows:5},
    {k:'committee',l:'3. Revisión del comité: firmas recibidas',t:'checks',o:()=>CC_COMMITTEE},{k:'risks',l:'4. Evaluación de riesgos del cambio (S × P × D = NPR)',t:'risks'},
    {k:'functionalTest',l:'5. Prueba de funcionalidad',t:'select',o:()=>YESNA,half:1},{k:'clientNotice',l:'6. Notificación al cliente',t:'select',o:()=>YESNA,half:1},{k:'approverId',l:'7. Aprueba',t:'person',half:1},{k:'status',l:'Estado',t:'select',o:()=>CHG_ST,req:1,half:1},
    {k:'closeNotes',l:'Cierre de la propuesta: observaciones',t:'textarea'}],
  def:{status:'Borrador',format:'',place:'Quito',functionalTest:'Sí',clientNotice:'No aplica'},
  mount:()=>{const R=$('#f_risks');if(!R)return;

<script>
/* ===== js/mod08-responsables.js ===== */
/* =====================================================================
   MOD-08 · RESPONSABLES Y ACCESOS
   Secciones:
     MOD-08.1 Lista de personas (internos, técnicos, contratistas, aprobadores)
     MOD-08.2 Formulario de persona
     MOD-08.3 Ingreso al sistema: asignar o cambiar PIN, cambiar rol, quitar acceso
   La lista es compartida por todos los proyectos. Agregar o modificar
   personas y accesos es exclusivo del administrador.
   v2.0.0 (SC-2026-002): el administrador cambia el PIN de cualquier persona,
   incluido el suyo, desde la ficha de la persona.
   ===================================================================== */
VIEWS_LIST.push(['responsables','Responsables',7]);

/* MOD-08.1 */
VIEWS.responsables=function(){
  const L=peopleSorted(),cnt={};tasksRaw().forEach(t=>[t.respId,t.contractorId].forEach(id=>{if(id)cnt[id]=(cnt[id]||0)+1}));
  return `<section class="card"><div class="sec-h"><h2>Responsables, técnicos y proveedores ${MT('MOD-08.1')}</h2><button class="btn primary sm" data-act="person-new">+ Agregar persona</button></div>
   <p class="hint" style="margin:0 0 10px">Lista compartida por todos los proyectos. Si cambia un responsable, edítalo aquí y se actualiza en todo el cronograma. Desactiva a quien ya no participe para conservar su historial. ${isAdmin()?'Desde la ficha de cada persona asignas o cambias su PIN y su acceso.':'Agregar o modificar personas requiere la autorización del administrador.'}</p>
   ${L.length?`<div class="tw"><table class="tbl"><thead><tr><th>Nombre</th><th>Cargo y rol</th><th>Tipo</th><th>Empresa</th><th>Teléfono</th><th>Actividades aquí</th><th>Acceso al sistema</th><th>Estado</th></tr></thead><tbody>${L.map(p=>`<tr class="click" data-act="person-edit" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b></td><td>${esc(p.role||'—')}</td><td class="nw">${esc(p.type||'—')}</td><td>${esc(p.company||'—')}</td><td class="nw mono">${esc(p.phone||'—')}</td><td class="n">${cnt[p.id]||0}</td><td class="nw">${p.access&&p.access!=='none'?`<span class="chip ${p.access==='admin'?'acc':p.access==='viewer'?'info':'ok'}">${esc(ROLES[p.access])}</span>`:'<span class="muted small">—</span>'}</td><td>${p.active===false?'<span class="chip idle">Inactivo</span>':'<span class="chip ok">Activo</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>Sin personas registradas</b>Agrega al líder, técnicos, contratistas y aprobadores.</div>'}</section>`;
};

/* MOD-08.2 y MOD-08.3 */
const pinTrivial=p=>new Set(p).size<3||'0123456789'.includes(p)||'9876543210'.includes(p);
function generarPin(){for(;;){const a=new Uint32Array(1);crypto.getRandomValues(a);const p=String(100000+a[0]%900000);if(!pinTrivial(p))return p}}
function mostrarPin(p,pin){
  modal('PIN asignado',`<p>Entrega este PIN personalmente a <b>${esc(p.name)}</b>. No se vuelve a mostrar; el PIN anterior ya no funciona.</p>
   <div id="pinv" style="font-family:var(--f-mono);font-size:40px;letter-spacing:.25em;text-align:center;padding:14px;border:2px dashed var(--rojo);border-radius:8px">${pin}</div>
   <p class="hint">Si lo olvida, vuelve a su ficha y asígnale uno nuevo.</p>`,
   `<span class="sp"></span><button class="btn" id="pcopy">Copiar</button><button class="btn primary" data-close>Listo</button>`,()=>{
    $('#pcopy').onclick=()=>navigator.clipboard?.writeText(pin).then(()=>toast('PIN copiado'),()=>toast('Copia el PIN manualmente'))});
}
const adminsActivos=()=>S.data.people.filter(p=>p.access==='admin'&&p.loginId);
SPEC.people={title:'persona',code:'MOD-08.2',global:1,adminOnly:1,fields:[{k:'name',l:'Nombre completo',t:'text',req:1},{k:'role',l:'Cargo y rol en el proyecto',t:'text',ph:'Ej.: Auxiliar de mantenimiento · técnico ejecutor'},{k:'type',l:'Tipo',t:'select',o:()=>PTYPES,req:1,half:1},{k:'company',l:'Empresa',t:'text',half:1},{k:'phone',l:'Teléfono',t:'text',half:1},{k:'active',l:'Activo (aparece en las listas de asignación)',t:'bool'}],
  def:{type:'Interno',active:true},
  canDelete:rec=>tasksRaw().some(t=>t.respId===rec.id||t.contractorId===rec.id)?'Esta persona tiene actividades asignadas. Desactívala o reasigna sus actividades antes de eliminarla.':(rec.loginId?'Primero quita su acceso al sistema.':null),
  extra:rec=>{if(!rec||!isAdmin())return '';
    const tiene=rec.loginId&&rec.access&&rec.access!=='none';
    const roles=Object.entries(ROLES).filter(([k])=>k!=='none').map(([k,l])=>`<option value="${k}" ${k===(tiene?rec.access:'member')?'selected':''}>${esc(l)}</option>`).join('');
    return `<div class="subsec"><h4>Ingreso al sistema ${MT('MOD-08.3')}</h4>
     <p class="hint" style="margin:0 0 8px">${tiene?`Tiene acceso como <b>${esc(ROLES[rec.access])}</b> y un PIN asignado.`:'Aún no ingresa al sistema. Asígnale acceso y PIN.'}</p>
     <div class="frm">
      <div class="fld half"><label for="ac_role">Acceso</label><select id="ac_role">${roles}</select></div>
      <div class="fld half"><label for="ac_greet">Saludo de bienvenida</label><select id="ac_greet"><option>Bienvenido</option><option ${rec.greet==='Bienvenida'?'selected':''}>Bienvenida</option></select></div>
      <div class="fld full"><label for="ac_pin">${tiene?'Nuevo PIN':'PIN'} (6 dígitos)</label><input id="ac_pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Déjalo vacío para generarlo automáticamente"></div>
      <div class="fld full" style="flex-direction:row;flex-wrap:wrap;gap:8px">
       <button type="button" class="btn dark" id="ac_pinbtn">${tiene?'Cambiar PIN':'Crear ingreso con PIN'}</button>
       ${tiene?'<button type="button" class="btn" id="ac_save">Guardar acceso y saludo</button><button type="button" class="btn danger" id="ac_off">Quitar acceso</button>':''}</div>
     </div><p class="err" id="ac_err" hidden></p></div>`},
  mount:(m,v)=>{if(!v.id||!isAdmin())return;const err=t=>{const e=$('#ac_err');e.textContent=t;e.hidden=!t};
    const p=person(v.id);
    const quedaAdmin=role=>!(p.access==='admin'&&role!=='admin'&&adminsActivos().length<2);
    $('#ac_pinbtn').onclick=async()=>{let pin=$('#ac_pin').value.trim();const role=$('#ac_role').value,greet=$('#ac_greet').value;
      if(pin&&!/^\d{6}$/.test(pin))return err('El PIN debe tener exactamente 6 dígitos.');
      if(pin&&pinTrivial(pin))return err('Ese PIN es muy fácil de adivinar (repetido o consecutivo). Usa otro.');
      if(!quedaAdmin(role))return err('Debe quedar al menos un administrador.');
      if(S.demo)return err('En modo demostración no se asignan PIN.');
      if(!pin)pin=generarPin();
      $('#ac_pinbtn').disabled=true;err('');
      try{await asignarPin(p,pin,role,greet);audit(p.loginId?'PIN cambiado':'Ingreso creado',`${p.name} · ${ROLES[role]}`);closeModal();mostrarPin(p,pin)}
      catch(e){$('#ac_pinbtn').disabled=false;err(errMsg(e))}};
    $('#ac_save')&&($('#ac_save').onclick=async()=>{const role=$('#ac_role').value,greet=$('#ac_greet').value;if(!quedaAdmin(role))return err('Debe quedar al menos un administrador.');
      try{await actualizarAcceso(p,role,greet);audit('Acceso modificado',`${p.name} · ${ROLES[role]}`);toast('Acceso actualizado');closeModal()}catch(e){err(errMsg(e))}});
    $('#ac_off')&&($('#ac_off').onclick=async()=>{if(!quedaAdmin('none'))return err('Debe quedar al menos un administrador.');
      try{await quitarIngreso(p);audit('Acceso retirado',p.name);toast('Acceso retirado');closeModal()}catch(e){err(errMsg(e))}});
  }};
Object.assign(ACT,{'person-new':()=>entityModal('people'),'person-edit':id=>{const r=person(id);r&&entityModal('people',r)}});

</script>
<script>
/* ===== js/mod09-proyecto.js ===== */
/* =====================================================================
   MOD-09 · PROYECTO, FRENTES, PLANTILLAS Y RESPALDOS
   Secciones:
     MOD-09.1 Datos del proyecto
     MOD-09.2 Frentes de trabajo (agregar, renombrar, ordenar)
     MOD-09.3 Duplicar como plantilla para un nuevo proyecto
     MOD-09.4 Respaldos: descargar e importar JSON, cronograma CSV
     MOD-09.5 Registro de ingresos y autorizaciones (solo administrador)
     MOD-09.6 Versión del sistema y registro de cambios del software
     MOD-09.7 Guía de uso
   ===================================================================== */
VIEWS_LIST.push(['proyecto','Proyecto',8]);

VIEWS.proyecto=function(){
  const p=proj();if(!p)return vNoProject();
  const k=kpis(),fr=fronts();
  const aud=S.data.audit.filter(x=>!x.projectId||x.projectId===S.pid).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,80);
  return `<div class="grid2">
  <section class="card"><div class="sec-h"><h2>Datos del proyecto ${MT('MOD-09.1')}</h2><button class="btn sm" data-act="proj-edit">Editar</button></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 18px;font-size:13px">
    ${[['Código',p.code],['Líder',pname(p.leaderId)],['Patrocinador',pname(p.sponsorId)],['Sedes',p.sites],['Inicio plan',k.n?fmtY(ds(k.start)):'—'],['Fin plan',k.n?fmtY(ds(k.end)):'—']].map(([a,b])=>`<div><div class="eyebrow">${a}</div>${esc(b||'—')}</div>`).join('')}</div>
   <div style="margin-top:12px"><div class="eyebrow">Objetivo</div><p style="margin:0">${esc(p.objective||'—')}</p></div>
   <div style="margin-top:10px"><div class="eyebrow">Alcance</div><p style="white-space:pre-line;margin:0">${esc(p.scope||'—')}</p></div></section>
  <section class="card"><div class="sec-h"><h2>Frentes de trabajo ${MT('MOD-09.2')}</h2><button class="btn sm" data-act="front-add">+ Frente</button></div>
   <div class="list">${fr.map((f,i)=>`<div class="li"><span class="sw" style="--c:${fcol(i+1)};margin-top:5px"></span><div class="body"><div class="t">${i+1}. ${esc(f)}</div><div class="m">${C.list.filter(c=>c.t.front===f).length} actividades</div></div><div class="r" style="display:flex;gap:4px"><button class="btn sm" data-act="front-up" data-id="${i}" ${i?'':'disabled'} aria-label="Subir">↑</button><button class="btn sm" data-act="front-down" data-id="${i}" ${i<fr.length-1?'':'disabled'} aria-label="Bajar">↓</button><button class="btn sm" data-act="front-ren" data-id="${i}">Renombrar</button></div></div>`).join('')}</div></section>
  </div>
  <div class="grid2">
  <section class="card"><h2>Reutilizar y respaldar</h2><div class="list">
   <div class="li"><div class="body"><div class="t">Duplicar como plantilla ${MT('MOD-09.3')}</div><div class="m">Copia frentes, actividades, vínculos y responsables a un proyecto nuevo con otra fecha de inicio. El avance se reinicia.</div></div><div class="r"><button class="btn sm primary" data-act="proj-dup">Duplicar</button></div></div>
   <div class="li"><div class="body"><div class="t">Nuevo proyecto en blanco</div><div class="m">Usa la misma lista de responsables.</div></div><div class="r"><button class="btn sm" data-act="proj-new">Crear</button></div></div>
   <div class="li"><div class="body"><div class="t">Respaldo completo (JSON) ${MT('MOD-09.4')}</div><div class="m">Cronograma, bitácora, autorizaciones, equipos y control de cambios del proyecto.</div></div><div class="r" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm" data-act="proj-export">Descargar</button><button class="btn sm" data-act="proj-import">Importar</button></div></div>
   <div class="li"><div class="body"><div class="t">Cronograma en CSV</div><div class="m">Para Excel o MS Project.</div></div><div class="r"><button class="btn sm" data-act="csv">Descargar</button></div></div>
  </div></section>
  <section class="card guide"><h2>Cómo se opera ${MT('MOD-09.7')}</h2><ol class="small">
   <li><b>Administrador:</b> planifica actividades, fechas, vínculos y responsables; crea los ingresos con PIN; autoriza modificaciones.</li>
   <li><b>Técnicos y líderes:</b> ingresan con su nombre y PIN, registran el avance en texto e informan incidencias. Pueden crear autorizaciones y equipos; para modificar algo existente se pide el PIN del administrador.</li>
   <li><b>Jefatura (solo resumen):</b> consulta Tablero y Cronograma.</li>
   <li><b>Seguimiento semanal:</b> revisar «Requiere atención», días de retraso y SPI; reprogramar con vínculos.</li></ol>
   <p class="hint" style="margin-top:10px">Por confidencialidad el sistema no almacena fotos ni documentos. Marco de referencia: ISO 21502:2020 y PMBOK® para planificación y control; ISO 9001 §8.5.6 para cambios; ISO 55001 §7.6 para información de activos.</p></section>
  </div>
  ${isAdmin()?`<section class="card"><div class="sec-h"><h2>Registro de ingresos y autorizaciones ${MT('MOD-09.5')}</h2><span class="muted small">Solo visible para el administrador</span></div>${aud.length?`<div class="tw"><table class="tbl"><thead><tr><th>Fecha y hora</th><th>Persona</th><th>Evento</th><th>Detalle</th></tr></thead><tbody>${aud.map(x=>`<tr><td class="nw mono">${esc(new Date(x.at).toLocaleString('es-EC',{dateStyle:'short',timeStyle:'short'}))}</td><td class="nw">${esc(pname(x.personId)!=='—'?pname(x.personId):x.byEmail)}</td><td class="nw">${esc(x.type)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>Sin eventos todavía</b>Aquí verás cada ingreso y cada cambio que autorices.</div>'}</section>`:''}
  <section class="card"><h2>Versión del sistema ${MT('MOD-09.6')}</h2><p class="small" style="margin:0 0 8px">${esc(SISTEMA.nombre)} · versión vigente <b>v${esc(SISTEMA.version)}</b>. Cualquier modificación del software se solicita con un código de módulo y se registra como control de cambios del sistema.</p>
   <div class="tw"><table class="tbl"><thead><tr><th>Versión</th><th>Fecha</th><th>Solicitud</th><th>Módulos</th><th>Descripción</th></tr></thead><tbody>${SISTEMA.registro.map(r=>`<tr><td class="mono nw">v${esc(r.version)}</td><td class="nw">${fmtY(r.fecha)}</td><td class="nw mono">${esc(r.sc)}</td><td>${esc(r.modulos)}</td><td>${esc(r.descripcion)}</td></tr>`).join('')}</tbody></table></div></section>`;
};

/* MOD-09.1 y MOD-09.3 */
function projModal(p,mode){
  const isNew=mode!=='edit',dup=mode==='dup',src=proj();
  const v=mode==='edit'?p:{name:dup?src.name+' (copia)':'',code:'',objective:dup?src.objective:'',scope:dup?src.scope:'',sites:dup?src.sites:'',leaderId:dup?src.leaderId:'',sponsorId:dup?src.sponsorId:''};
  const body=`<div class="small muted">${MT(dup?'MOD-09.3':'MOD-09.1')}</div><form class="frm" novalidate>
   <div class="fld full"><label for="p_name">Nombre del proyecto <i class="req">*</i></label><input id="p_name" value="${esc(v.name)}"></div>
   <div class="fld half"><label for="p_code">Código</label><input id="p_code" value="${esc(v.code)}" placeholder="PRY-2026-01"></div>
   <div class="fld half"><label for="p_sites">Sedes</label><input id="p_sites" value="${esc(v.sites)}"></div>
   <div class="fld half"><label for="p_lead">Líder del proyecto</label><select id="p_lead"><option value="">—</option>${peopleOpts(v.leaderId)}</select></div>
   <div class="fld half"><label for="p_spon">Patrocinador / aprobador</label><select id="p_spon"><option value="">—</option>${peopleOpts(v.sponsorId)}</select></div>
   <div class="fld full"><label for="p_obj">Objetivo</label><textarea id="p_obj" rows="2">${esc(v.objective)}</textarea></div>
   <div class="fld full"><label for="p_scope">Alcance</label><textarea id="p_scope" rows="4">${esc(v.scope)}</textarea></div>
   ${isNew?`<div class="fld half"><label for="p_start">Fecha de inicio <i class="req">*</i></label><input type="date" id="p_start" value="${ds(TD()+3)}"></div>`:''}
   ${dup?`<div class="fld full chk"><label><input type="checkbox" id="p_perm" checked> Copiar también las autorizaciones planificadas</label></div><div class="fld full chk"><label><input type="checkbox" id="p_resp" checked> Mantener los responsables asignados</label></div>`:''}
   <p class="err" id="ferr" hidden></p></form>`;
  modal(dup?'Duplicar como plantilla':isNew?'Nuevo proyecto':'Datos del proyecto',body,`<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">${dup?'Crear copia':isNew?'Crear proyecto':'Guardar'}</button>`,()=>{
    $('#fsave').onclick=async()=>{const name=$('#p_name').value.trim();if(!name)return showErr('Escribe el nombre del proyecto.');
      const d={name,code:$('#p_code').value.trim(),sites:$('#p_sites').value.trim(),leaderId:$('#p_lead').value,sponsorId:$('#p_spon').value,objective:$('#p_obj').value.trim(),scope:$('#p_scope').value.trim()};
      const start=isNew?$('#p_start').value:null;if(isNew&&!start)return showErr('Indica la fecha de inicio.');
      const keepResp=dup&&$('#p_resp').checked,copyPerm=dup&&$('#p_perm').checked;
      busy(true,'Guardando…');const nid=uid('prj');
      try{const ok=await authorize(dup?'Duplicar el proyecto como plantilla':isNew?'Crear un proyecto nuevo':'Modificar los datos del proyecto',async db=>{
          if(mode==='edit')return patch('projects',p.id,d,db);
          if(!dup)return save('projects',nid,{...d,fronts:[],createdAt:nowISO()},db);
          const L=C.list,delta=dn(start)-Math.min(...L.map(c=>c.s)),map={};L.forEach(c=>map[c.id]=uid('tsk'));
          await save('projects',nid,{...d,fronts:fronts(),createdAt:nowISO()},db);
          let i=0;for(const c of L){i++;busy(true,`Copiando actividad ${i} de ${L.length}`);const t=c.t;
            await save('tasks',map[c.id],{projectId:nid,front:t.front,site:t.site||'',name:t.name,desc:t.desc||'',respId:keepResp?t.respId||'':'',contractorId:keepResp?t.contractorId||'':'',start:ds(c.s+delta),end:ds(c.e+delta),deps:(t.deps||[]).map(x=>map[x]).filter(Boolean),notes:'',order:t.order||0,progress:0,actualStart:null,actualEnd:null,createdAt:nowISO()},db)}
          if(copyPerm)for(const x of of('permits')){const dd=dn(x.date);await save('permits',uid('per'),{projectId:nid,type:x.type,title:x.title,taskId:map[x.taskId]||'',area:x.area||'',date:dd!=null?ds(dd+delta):'',from:x.from||'',to:x.to||'',supplierId:x.supplierId||'',requesterId:x.requesterId||'',approverId:x.approverId||'',status:'Planificado',prep:{},crew:'',controls:x.controls||'',notes:'',createdAt:nowISO(),createdByEmail:S.session?.email||''},db)}});
        if(!ok){busy(false);return}
        if(isNew){S.pid=nid;lsSet('cp-pid',nid);S.gInit=false}
        closeModal();toast(mode==='edit'?'Proyecto actualizado':dup?'Plantilla creada':'Proyecto creado')}
      catch(e){busy(false);showErr(errMsg(e))}};
  });
}
/* MOD-09.2 */
function frontModal(idx){
  const fr=fronts(),old=idx==null?'':fr[idx];
  modal(idx==null?'Nuevo frente':'Renombrar frente',`<div class="small muted">${MT('MOD-09.2')}</div><form class="frm" novalidate><div class="fld full"><label for="fr_n">Nombre del frente</label><input id="fr_n" value="${esc(old)}" placeholder="Ej.: Obras civiles"></div><p class="err" id="ferr" hidden></p></form>`,`<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">Guardar</button>`,()=>{
    $('#fsave').onclick=async()=>{const n=$('#fr_n').value.trim();if(!n)return showErr('Escribe un nombre.');if(n!==old&&fr.includes(n))return showErr('Ya existe un frente con ese nombre.');busy(true,'Guardando…');
      try{const ok=await authorize(idx==null?`Agregar el frente «${n}»`:`Renombrar el frente «${old}»`,async db=>{const nf=idx==null?[...fr,n]:fr.map(f=>f===old?n:f);await patch('projects',S.pid,{fronts:nf},db);if(idx!=null&&n!==old)for(const t of tasksRaw().filter(t=>t.front===old))await patch('tasks',t.id,{front:n},db)});
        if(!ok){busy(false);return}closeModal();toast('Frente guardado')}
      catch(e){busy(false);showErr(errMsg(e))}}});
}
async function moveFront(i,d){const fr=fronts(),j=i+d;if(j<0||j>=fr.length)return;[fr[i],fr[j]]=[fr[j],fr[i]];try{await authorize('Reordenar frentes',db=>patch('projects',S.pid,{fronts:fr},db))}catch(e){toast(errMsg(e))}}

/* MOD-09.4 Respaldos */
function exportarJSON(){const p=proj();const o={format:'cp-proyectos',version:2,sistema:SISTEMA.version,exportedAt:nowISO(),project:p,people:S.data.people};['tasks','logs','permits','equipment','changes'].forEach(c=>o[c]=of(c));descargar(`Respaldo_${slug(p.code||p.name)}_${today()}.json`,JSON.stringify(o,null,1),'application/json')}
function importarJSON(){
  modal('Importar respaldo',`<div class="small muted">${MT('MOD-09.4')}</div><form class="frm" novalidate><div class="fld full"><label for="imp">Archivo de respaldo (.json)</label><input type="file" id="imp" accept=".json,application/json"><div class="hint">Se crea como proyecto nuevo; no reemplaza nada. Las personas que no existan se agregan a la lista.</div></div><p class="err" id="ferr" hidden></p></form>`,`<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">Importar</button>`,()=>{
    $('#fsave').onclick=async()=>{const f=$('#imp').files[0];if(!f)return showErr('Elige el archivo.');let o;try{o=JSON.parse(await f.text())}catch(e){return showErr('El archivo no es un JSON válido.')}
      if(o.format!=='cp-proyectos'||!o.project)return showErr('Este archivo no es un respaldo de este sistema.');
      busy(true,'Importando…');
      try{const nid=uid('prj'),map={};const ok=await authorize('Importar un respaldo como proyecto nuevo',async db=>{
        for(const p of o.people||[])if(!S.data.people.find(x=>x.id===p.id)){const{id,...r}=p;delete r.email;r.access='none';await save('people',id,r,db)}
        const{id:_,...pr}=o.project;await save('projects',nid,{...pr,name:pr.name+(S.data.projects.some(x=>x.name===pr.name)?' (importado)':''),createdAt:nowISO()},db);
        (o.tasks||[]).forEach(t=>map[t.id]=uid('tsk'));
        for(const t of o.tasks||[]){const{id,...r}=t;await save('tasks',map[id],{...r,projectId:nid,deps:(r.deps||[]).map(x=>map[x]).filter(Boolean)},db)}
        for(const col of['logs','permits','equipment','changes'])for(const x of o[col]||[]){const{id,files,plate,...r}=x;await save(col,uid(col.slice(0,3)),{...r,projectId:nid,taskId:r.taskId?map[r.taskId]||'':r.taskId||''},db)}});
        if(!ok){busy(false);return}
        /* v3.1.1 (SC-2026-016): al importar, la ficha del administrador queda enlazada a su ingreso actual */
        const yo=S.session?.personId;if(yo&&isAdmin()&&!S.demo){try{await patch('people',yo,{access:'admin',loginId:'pin'})}catch(e){}}
        S.pid=nid;lsSet('cp-pid',nid);closeModal();toast('Respaldo importado')}
      catch(e){busy(false);showErr(errMsg(e))}}});
}
Object.assign(ACT,{
  'proj-new':()=>projModal(null,'new'),'proj-edit':()=>projModal(proj(),'edit'),
  'proj-dup':()=>{if(!C.list.length)return toast('El proyecto no tiene actividades para copiar.');projModal(null,'dup')},
  'proj-export':()=>exportarJSON(),'proj-import':()=>importarJSON(),
  'front-add':()=>frontModal(null),'front-ren':i=>frontModal(+i),'front-up':i=>moveFront(+i,-1),'front-down':i=>moveFront(+i,1),
});

</script>
<script>
/* ===== js/mod15-informes.js ===== */
/* =====================================================================
   MOD-15 · INFORMES, EXPORTACIÓN Y RESPALDOS          (v2.1.0)
   SC-2026-003 (exportar PDF y Excel) · SC-2026-004 (respaldos)
   Secciones:
     MOD-15.1 Ventana «Exportar» (botón en la barra superior)

     MOD-15.4 Respaldo completo del sistema y restauración (solo administrador)
     MOD-15.5 Recordatorio de respaldo (cada 7 días)
   Todo se genera en el equipo de quien exporta: no se envía información a terceros.
   La jefatura (solo resumen) exporta únicamente Resumen y Cronograma.
   ===================================================================== */

/* ---------- MOD-15.1 Ventana Exportar ---------- */
const SECCIONES=[
  ['resumen','Resumen e indicadores',1],['cronograma','Cronograma y tabla de control',1],['atencion','Actividades atrasadas, en riesgo o bloqueadas',0],
  ['bitacora','Bitácora de avances',0],['autorizaciones','Autorizaciones y preparación ATS/PTS',0],['equipos','Inventario de equipos',0],
  ['cambios','Control de cambios y matriz de riesgos',0],['responsables','Responsables',0]];
const seccionesPermitidas=()=>isViewer()?SECCIONES.filter(s=>['resumen','cronograma','atencion'].includes(s[0])):SECCIONES;
function abrirExportar(pestana){
  if(!proj())return toast('No hay un proyecto seleccionado.');
  const tabs=[['pdf','Informe PDF'],['excel','Excel'],...(isAdmin()?[['respaldo','Respaldos']]:[])];let tab=pestana&&tabs.some(t=>t[0]===pestana)?pestana:'pdf';
  const secs=seccionesPermitidas();
  const cuerpo=()=>tab==='respaldo'?respaldoHTML():`<div class="small muted">${MT(tab==='pdf'?'MOD-15.2':'MOD-15.3')}</div>
    <p class="small" style="margin:0">${tab==='pdf'?'Primero verás el informe en pantalla; luego pulsa <b>«Guardar como PDF / Imprimir»</b> y elige <b>«Guardar como PDF»</b> como destino.':'Se descarga un libro de Excel con una hoja por sección, con encabezados y filtros listos para trabajar.'}</p>
    <div class="fld full"><label>Secciones a incluir</label><div class="checks" style="flex-direction:column;gap:6px" id="ex_secs">${secs.map(([k,l,d])=>`<label><input type="checkbox" value="${k}" ${d||tab==='excel'?'checked':''}> ${esc(l)}</label>`).join('')}</div></div>
    ${tab==='pdf'?`<div class="fld full"><label for="ex_ori">Orientación</label><select id="ex_ori"><option value="landscape">Horizontal (recomendada para el cronograma)</option><option value="portrait">Vertical</option></select></div>`:''}
    <p class="err" id="ferr" hidden></p>`;
  const pie=()=>tab==='respaldo'?`<span class="sp"></span><button class="btn" data-close>Cerrar</button>`:`<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ex_go">${tab==='pdf'?'Ver informe':'Descargar Excel'}</button>`;
  const pintar=()=>{modal('Exportar',`<div class="seg" role="group" aria-label="Formato">${tabs.map(([k,l])=>`<button type="button" aria-pressed="${tab===k}" data-extab="${k}">${l}</button>`).join('')}</div>${cuerpo()}`,pie(),m=>{
    $$('[data-extab]',m).forEach(b=>b.onclick=()=>{tab=b.dataset.extab;pintar()});
    if(tab==='respaldo')return montarRespaldo(m);
    $('#ex_go').onclick=async()=>{const sel=$$('#ex_secs input:checked').map(x=>x.value);if(!sel.length)return showErr('Elige al menos una sección.');
      try{if(tab==='pdf'){const ori=$('#ex_ori').value;closeModal();imprimirInforme(sel,ori)}else{busy(true,'Generando…');await descargarExcel(sel);closeModal()}
        audit(tab==='pdf'?'Informe PDF generado':'Excel exportado',sel.join(', '))}
      catch(e){busy(false);showErr('No se pudo generar: '+(e.message||e))}}})};
  pintar();
}
ACT['export-open']=v=>abrirExportar(v);

/* ---------- Datos comunes para PDF y Excel ---------- */
const hoyLargo=()=>new Date().toLocaleString('es-EC',{dateStyle:'long',timeStyle:'short'});
function filasCronograma(){return C.list.map(c=>({EDT:c.wbs,Frente:c.t.front,Actividad:c.t.name,Sede:c.t.site||'',Responsable:pname(c.t.respId),Contratista:c.t.contractorId?pname(c.t.contractorId):'',
  'Inicio plan':c.t.start,'Fin plan':c.t.end,'Días':c.dur,Predecesoras:c.preds.map(p=>C.map[p.id]?.wbs).join(' '),'Inicio real':c.t.actualStart||'','Fin real':c.t.actualEnd||'',
  'Plan a hoy %':c.planned,'Real %':c.prog,'Retraso (días)':c.delay,Estado:ST[c.st][0],Notas:c.t.notes||''}))}
function filasBitacora(){return of('logs').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.createdAt).localeCompare(String(b.createdAt))).map(l=>({Fecha:l.date,Actividad:tlabel(l.taskId),Reporta:pname(l.personId),'Avance anterior %':+l.prevProgress||0,'Avance %':+l.progress||0,'Trabajo realizado':l.note||'',Incidencia:l.issue?(l.issueText||''):'','Incidencia resuelta':l.issue?(l.issueResolved?'Sí':'No'):''}))}
function filasAutorizaciones(){return of('permits').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(p=>({Fecha:p.date,Desde:p.from||'',Hasta:p.to||'',Tipo:p.type,Trabajo:p.title,'Área':p.area||'',Actividad:p.taskId?tlabel(p.taskId):'',Proveedor:p.supplierId?pname(p.supplierId):'',Solicita:p.requesterId?pname(p.requesterId):'',Aprueba:p.approverId?pname(p.approverId):'','N.º ATS/PTS':p.atsCode||'','Preparación %':prepPct(p),Estado:p.status,Observaciones:p.notes||''}))}
function filasEquipos(){return of('equipment').slice().sort((a,b)=>String(a.tag).localeCompare(String(b.tag))).map(e=>({'Código / TAG':e.tag||'',Equipo:e.name,Marca:e.brand||'',Modelo:e.model||'',Serie:e.serial||'',Cantidad:+e.qty||1,Sede:e.site||'','Ubicación':e.location||'',Proveedor:e.supplierId?pname(e.supplierId):'','Recepción':e.receivedDate||'','Garantía hasta':e.warranty||'','Datos de placa':e.specs||'','Plan PM':e.inPM?'Sí':'No',Estado:e.status||'',Actividad:e.taskId?tlabel(e.taskId):''}))}
function filasCambios(){return of('changes').map(c=>({'N.º':c.code,Formato:c.format||'',Cambio:c.title,Solicitante:c.requesterId?pname(c.requesterId):'','Área':c.area||'',Fecha:c.date||'',Alcance:(c.scope||[]).join(', '),'Situación actual':c.current||'','Situación propuesta':c.description||'','Justificación':c.reason||'','Áreas impactadas':c.impactText||'',Beneficios:c.benefits||'','Comité (firmas)':(c.committee||[]).join(', '),'Prueba de funcionalidad':c.functionalTest||'','Notificación al cliente':c.clientNotice||'',Aprueba:c.approverId?pname(c.approverId):'',Estado:c.status}))}
function filasRiesgos(){return of('changes').flatMap(c=>(c.risks||[]).map((r,i)=>({'N.º CC':c.code,'N.º':i+1,Riesgo:r.desc,S:r.s||'',P:r.p||'',D:r.d||'',NPR:r.npr||'',Tipo:r.npr?nprType(r.npr)[0]:'',Control:r.ctl||''})))}
function filasResponsables(){const cnt={};tasksRaw().forEach(t=>[t.respId,t.contractorId].forEach(id=>{if(id)cnt[id]=(cnt[id]||0)+1}));return peopleSorted().map(p=>({Nombre:p.name,'Cargo y rol':p.role||'',Tipo:p.type||'',Empresa:p.company||'','Teléfono':p.phone||'','Actividades en el proyecto':cnt[p.id]||0,'Acceso al sistema':p.access&&p.access!=='none'?ROLES[p.access]:'',Estado:p.active===false?'Inactivo':'Activo'}))}
function filasResumen(){const p=proj(),k=kpis();return[
  {Concepto:'Proyecto',Valor:p.name},{Concepto:'Código',Valor:p.code||''},{Concepto:'Sedes',Valor:p.sites||''},{Concepto:'Líder',Valor:pname(p.leaderId)},{Concepto:'Patrocinador',Valor:pname(p.sponsorId)},
  {Concepto:'Avance real ponderado %',Valor:Math.round(k.real*10)/10},{Concepto:'Avance planificado a hoy %',Valor:Math.round(k.plan*10)/10},{Concepto:'SPI',Valor:Math.round(k.spi*100)/100},
  {Concepto:'Actividades',Valor:k.n},{Concepto:'Completadas',Valor:k.done},{Concepto:'Atrasadas',Valor:k.late},{Concepto:'Días de retraso acumulado',Valor:k.delayDays},{Concepto:'En riesgo',Valor:k.risk},{Concepto:'Bloqueadas',Valor:k.blocked},
  {Concepto:'Inicio planificado',Valor:ds(k.start)},{Concepto:'Fin planificado',Valor:ds(k.end)},{Concepto:'Fin pronosticado',Valor:ds(k.fend)},{Concepto:'Desfase (días)',Valor:k.slip},
  {Concepto:'Autorizaciones por gestionar (7 días)',Valor:k.perm},{Concepto:'Incidencias abiertas',Valor:k.incid},
  {Concepto:'Emitido',Valor:hoyLargo()},{Concepto:'Emitido por',Valor:S.session?.name||''},{Concepto:'Sistema',Valor:`${SISTEMA.nombre} v${SISTEMA.version}`}]}
function filasFrentes(){return fronts().map((f,i)=>{const cs=C.list.filter(c=>c.t.front===f);if(!cs.length)return null;const sd=cs.reduce((a,c)=>a+c.dur,0);
  return{'N.º':i+1,Frente:f,Actividades:cs.length,Completadas:cs.filter(c=>c.st==='done').length,Atrasadas:cs.filter(c=>c.st==='late').length,'Plan a hoy %':pct(cs.reduce((a,c)=>a+c.planned*c.dur,0)/sd),'Real %':pct(cs.reduce((a,c)=>a+c.prog*c.dur,0)/sd)}}).filter(Boolean)}

  const pr=document.createElement('div');pr.id='print';document.body.appendChild(pr);})();
function tablaHTML(filas,cols){if(!filas.length)return '<p class="muted">Sin registros.</p>';cols=cols||Object.keys(filas[0]);
  return `<div class="tw"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${filas.map(f=>`<tr>${cols.map(c=>`<td${typeof f[c]==='number'?' class="n"':''}>${esc(f[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function informeHTML(sel){
  const p=proj(),k=kpis(),h=[];

    <div style="max-width:720px;margin-top:10px">${curvaS()}</div><h2>Avance por frente</h2>${tablaHTML(filasFrentes())}`)}
  if(sel.includes('cronograma'))h.push(`<h2>Cronograma y tabla de control</h2><div class="tw"><table class="tbl"><thead><tr><th>EDT</th><th>Actividad</th><th>Responsable</th><th>Inicio</th><th>Fin</th><th>Avance</th><th>Plan</th><th>Retraso</th><th>Estado</th></tr></thead><tbody>${C.list.map(c=>`<tr><td class="mono">${c.wbs}</td><td>${esc(c.t.name)}</td><td>${esc(pname(c.t.respId))}</td><td class="nw">${fmtY(c.t.start)}</td><td class="nw">${fmtY(c.t.end)}</td><td><div style="display:flex;gap:6px;align-items:center"><div class="bar"><span style="width:${c.prog}%"></span></div>${c.prog}%</div></td><td class="n">${c.planned}%</td><td class="n">${c.delay?'+'+c.delay+' d':'—'}</td><td class="nw">${ST[c.st][0]}</td></tr>`).join('')}</tbody></table></div>`);

/* v2.1.2 (SC-2026-008): el informe se muestra primero en pantalla y se imprime con un botón.
   Antes se imprimía automáticamente y se borraba a los 1,5 s, lo que dejaba el PDF en blanco
   en celulares y en navegadores donde la impresión no detiene la página. */
function imprimirInforme(sel,ori){
  const pr=$('#print'),p=proj();
  let pg=$('#print-page');if(!pg){pg=document.createElement('style');pg.id='print-page';document.head.appendChild(pg)}pg.textContent=`@media print{@page{size:A4 ${ori};margin:12mm}}`;
  pr.innerHTML=`<div class="pr-bar"><b>Vista previa del informe</b><span class="sp"></span><button type="button" class="btn primary" id="pr_go">Guardar como PDF / Imprimir</button><button type="button" class="btn" id="pr_close">Cerrar</button>
    <div class="pr-ayuda">En la ventana que se abre, en <b>Destino</b> elige <b>«Guardar como PDF»</b>. En el celular: menú del navegador → Compartir → Imprimir → Guardar como PDF.</div></div>
    <div class="pr-hoja">${informeHTML(sel)}</div>`;
  pr.classList.add('abierto');document.body.classList.add('imprimiendo');pr.scrollTop=0;
  const titulo=document.title;
  const cerrar=()=>{pr.classList.remove('abierto');pr.innerHTML='';document.body.classList.remove('imprimiendo');document.title=titulo;removeEventListener('keydown',esc_)};
  const esc_=e=>{if(e.key==='Escape')cerrar()};addEventListener('keydown',esc_);
  $('#pr_close').onclick=cerrar;
  $('#pr_go').onclick=()=>{document.title=`Informe_${slug(p.code||p.name)}_${today()}`;const r=()=>{document.title=titulo;removeEventListener('afterprint',r)};addEventListener('afterprint',r);
    try{window.print()}catch(e){toast('Este visor no permite imprimir. Abre el sistema en Chrome o Edge.')}};
}

const XLSX_LITE=(()=>{
  const enc=new TextEncoder();let T=null;
  const crc=b=>{if(!T){T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}}let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  function zip(files){const parts=[],central=[];let off=0;
    for(const f of files){const name=enc.encode(f.name),data=enc.encode(f.data),c=crc(data);
      const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
      parts.push(new Uint8Array(h.buffer),name,data);
      const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint16(14,0x21,true);d.setUint32(16,c,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,name.length,true);d.setUint32(42,off,true);
      central.push(new Uint8Array(d.buffer),name);off+=30+name.length+data.length}
    const cs=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
    return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
  const x=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const nombreHoja=(n,usados)=>{let b=String(n).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Hoja',s=b,i=2;while(usados.has(s))s=b.slice(0,28)+' '+i++;usados.add(s);return s};
  function hoja(filas){
    const cols=filas.length?Object.keys(filas[0]):['Sin registros'];
    const anchos=cols.map(c=>Math.min(60,Math.max(10,String(c).length+2,...filas.map(f=>String(f[c]??'').length+2))));
    const celda=(v,r,c,s)=>{const ref=col(c)+r;if(v===null||v===undefined||v==='')return '';if(typeof v==='number'&&isFinite(v))return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr" s="${String(v).length>60&&s===0?2:s}"><is><t xml:space="preserve">${x(v)}</t></is></c>`};
    const filasXml=[`<row r="1">${cols.map((c,i)=>celda(c,1,i,1)).join('')}</row>`,...filas.map((f,ri)=>`<row r="${ri+2}">${cols.map((c,i)=>celda(f[c],ri+2,i,0)).join('')}</row>`)].join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${filasXml}</sheetData>${filas.length?`<autoFilter ref="A1:${col(cols.length-1)}${filas.length+1}"/>`:''}</worksheet>`}
  function libro(hojas){
    const usados=new Set(),nombres=hojas.map(h=>nombreHoja(h.nombre,usados));
    const files=[
      {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
      {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
      {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${nombres.map((n,i)=>`<sheet name="${x(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${hojas.map((h,i)=>h.filas.length?`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(nombres[i]).replace(/'/g,"''")}'!$A$1:$${col(Object.keys(h.filas[0]).length-1)}$${h.filas.length+1}</definedName></definedNames>`:'').join('').replace(/<\/definedNames><definedNames>/g,'')}</workbook>`},
      {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
      {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFC8102E"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
      ...hojas.map((h,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:hoja(h.filas)}))];
    return zip(files)}
  return{libro};
})();
function hojasExcel(sel){const H=[];

    if(o.formato!=='cp-respaldo-completo')return err('Este archivo no es un respaldo completo del sistema.');
    const total=COLS_RESPALDO.reduce((a,c)=>a+(o[c]||[]).length,0);let n=0;$('#rb_rest').disabled=true;
    try{for(const c of COLS_RESPALDO){if(c==='audit')continue;for(const d of o[c]||[]){const{id,...data}=d;await save(c,id,data);n++;if(n%10===0)msg(`Restaurando ${n} de ${total}…`)}}
      await audit('Respaldo restaurado',`Archivo del ${o.fecha} · ${n} registros`);msg(`Restauración terminada: ${n} registros.`);toast('Respaldo restaurado')}

}

  <section class="card"><h2>Módulos visibles ${MT('MOD-16.1')}</h2><p class="hint" style="margin:0 0 8px">Desactiva un módulo que no uses en un proyecto; sus datos se conservan y vuelve a aparecer al activarlo. Tablero, Cronograma, Responsables, Proyecto y Configuración están siempre activos.</p>
   <div class="checks" style="flex-direction:column;gap:6px" id="cfg_mods">${MODULOS_OPCIONALES.map(([k,l])=>`<label><input type="checkbox" value="${k}" ${(S.offModules||[]).includes(k)?'':'checked'}> ${esc(l)}</label>`).join('')}</div></section>
  <div class="grid2">${LISTAS.map(([k,l,code,h])=>`<section class="card"><h2>${esc(l)} ${MT(code)}</h2>${h?`<p class="hint" style="margin:0 0 6px">${esc(h)}</p>`:''}<textarea class="cfg-list" data-k="${k}" rows="${Math.min(12,Math.max(4,lista(k).length+1))}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)" aria-label="${esc(l)}">${esc(lista(k).join('\n'))}</textarea></section>`).join('')}</div>
  <section class="card"><h2>Preparación por tipo de autorización ${MT('MOD-16.3')}</h2><p class="hint" style="margin:0 0 8px">Para cada tipo, lo que suele pedir Seguridad Industrial además de los puntos comunes. Si agregas un tipo nuevo arriba, guarda primero para que aparezca aquí.</p>
   <div class="grid2">${PERMIT_TYPES.map(t=>`<div class="fld"><label>${esc(t)}</label><textarea class="cfg-prep" data-t="${esc(t)}" rows="5" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)">${esc((PREP[t]||[]).join('\n'))}</textarea></div>`).join('')}</div></section>`;
};
const lineas=t=>[...new Set(String(t).split('\n').map(s=>s.trim()).filter(Boolean))];
async function guardarConfig(nueva,etiqueta){
  const cur=S.data.config?.find(x=>x.id==='sistema')||{};const{id,...resto}=cur;
  await save('config','sistema',{...resto,...nueva});firmaCfg='';audit('Configuración modificada',etiqueta);toast('Configuración guardada');
}
Object.assign(ACT,{
  'cfg-save':async()=>{if(!isAdmin())return;
    const n={offModules:MODULOS_OPCIONALES.map(m=>m[0]).filter(k=>!$$('#cfg_mods input:checked').some(x=>x.value===k))};
    for(const ta of $$('.cfg-list')){const v=lineas(ta.value);if(!v.length)return toast(`La lista «${LISTAS.find(l=>l[0]===ta.dataset.k)[1]}» no puede quedar vacía.`);n[ta.dataset.k]=v}
    n.prep={};$$('.cfg-prep').forEach(ta=>n.prep[ta.dataset.t]=lineas(ta.value));
    const cambios=Object.keys(n).filter(k=>JSON.stringify(n[k])!==JSON.stringify(k==='offModules'?(S.offModules||[]):k==='prep'?Object.fromEntries(PERMIT_TYPES.map(t=>[t,PREP[t]||[]])):({sites:SITES,ptypes:PTYPES,permitTypes:PERMIT_TYPES,permitStatus:PERMIT_ST,prepCommon:PREP_COMMON,eqStatus:EQ_ST,ccScope:CC_SCOPE,ccCommittee:CC_COMMITTEE,chgStatus:CHG_ST})[k]));
    if(!cambios.length)return toast('No hay cambios que guardar.');
    try{await guardarConfig(n,'Listas: '+cambios.join(', '))}catch(e){toast(errMsg(e))}},
  'cfg-reset':async()=>{if(!isAdmin())return;
    modal('Restablecer configuración','<p>Se recuperan las listas y estados originales de la versión instalada y se activan todos los módulos. Los registros existentes no se modifican.</p>',`<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn danger" id="cfg_ok">Restablecer</button>`,()=>{
      $('#cfg_ok').onclick=async()=>{try{const{offModules,...f}=CFG_FABRICA;await guardarConfig({...JSON.parse(JSON.stringify(f)),offModules:[]},'Restablecida a valores de fábrica');closeModal()}catch(e){toast(errMsg(e))}}})},
});

</script>
<script>iniciarSistema();</script>
</body>
</html>
