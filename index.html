  const ng=$('.g-scroll');
  if(ng&&S.g){if(!S.gInit||S.gToday){ng.scrollLeft=Math.max(0,(TD()-S.g.r0)*S.g.dw-160);S.gInit=true;S.gToday=false}else if(gs){ng.scrollLeft=gsl;ng.scrollTop=gst}}
  if(aeId){const el=document.getElementById(aeId);if(el){el.focus();try{if(selS!=null)el.setSelectionRange(selS,selS)}catch(e){}}}
}
function vNoProject(){return `<div class="card empty"><b>Aún no hay un proyecto</b>${isAdmin()?'Crea el primero o importa un respaldo.':'El administrador aún no ha creado el proyecto.'}${isAdmin()?`<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="proj-new">Crear proyecto</button><button class="btn" data-act="proj-import">Importar respaldo</button></div>`:''}</div>`}

/* ---------- MOD-13.6 Ventanas y formularios ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}
function banner(html){const b=$('#banner');b.innerHTML=html;b.hidden=!html}
function modal(title,body,foot,onMount,wide){const m=$('#modal');m.innerHTML=`<div class="ov"><div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="x" data-close aria-label="Cerrar">×</button></header><div class="dlg-body">${body}</div><footer>${foot}</footer></div></div>`;m.hidden=false;
  m.querySelector('.ov').addEventListener('click',e=>{if(e.target.classList.contains('ov')||e.target.closest('[data-close]'))closeModal()});onMount&&onMount(m);const f=m.querySelector('.dlg-body input,.dlg-body select,.dlg-body textarea');f&&!f.disabled&&setTimeout(()=>f.focus({preventScroll:true}),30)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&$('#auth').hidden)closeModal()});
const footer=(isNew,label)=>`${!isNew?'<button class="btn danger" id="fdel">Eliminar</button>':''}<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">${label||'Guardar'}</button>`;
function armDelete(btn,fn){if(!btn)return;btn.onclick=async()=>{if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='Confirmar eliminación';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent='Eliminar'}},4000);return}btn.disabled=true;try{const ok=await fn();if(ok===false){btn.disabled=false;return}closeModal();toast('Eliminado')}catch(e){btn.disabled=false;showErr(errMsg(e))}}}
function showErr(m){const e=$('#ferr');if(e){e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'})}else toast(m)}
function busy(on,msg){const b=$('#fsave');if(b)b.disabled=on;const s=$('#fmsg');if(s)s.textContent=msg||''}
function readonly(m){$$('input,select,textarea',m.querySelector('.dlg-body')).forEach(x=>x.disabled=true);$$('#fsave,#fdel,footer [data-act]',m).forEach(b=>b.hidden=true);
  m.querySelector('.dlg-body').insertAdjacentHTML('afterbegin','<div class="ro-note">Vista de consulta. Con tu acceso no se pueden hacer cambios.</div>')}

function fieldHTML(f,val){
  const id='f_'+f.k,lab=`<label for="${id}">${esc(f.l)}${f.req?' <i class="req">*</i>':''}</label>`;let inp;
  switch(f.t){
    case 'textarea':inp=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;break;
    case 'select':inp=`<select id="${id}">${f.req?'':'<option value="">—</option>'}${f.o().map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'selectkv':inp=`<select id="${id}">${f.o().map(([k,l])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;break;
    case 'person':inp=`<select id="${id}"><option value="">—</option>${peopleOpts(val,f.filter)}</select>`;break;
    case 'task':inp=`<select id="${id}"><option value="">— Sin vincular —</option>${taskOpts(val)}</select>`;break;
    case 'bool':return `<div class="fld full chk"><label><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.l)}</label></div>`;
    case 'checks':inp=`<div class="checks" id="${id}">${f.o().map(o=>`<label><input type="checkbox" value="${esc(o)}" ${(val||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;break;
    default:
      if(FIELD_TYPES[f.t]){inp=FIELD_TYPES[f.t].html(f,val,id);break}
      inp=`<input id="${id}" type="${f.t}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.t==='number'?'step="any"':''}>`;
  }
  return `<div class="fld ${f.half?'half':'full'}">${lab}${inp}</div>`;
}
const FIELD_TYPES={};   // tipos de campo especiales que agregan los módulos (p. ej. riesgos en MOD-07)
function readForm(fields){const o={};fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;
  if(FIELD_TYPES[f.t]){o[f.k]=FIELD_TYPES[f.t].read(el);return}
  if(f.t==='bool')o[f.k]=el.checked;else if(f.t==='checks')o[f.k]=$$('input:checked',el).map(x=>x.value);else if(f.t==='number')o[f.k]=el.value===''?null:+el.value;else o[f.k]=el.value.trim()});return o}

/* Formulario genérico: crear sin PIN (salvo personas); modificar o eliminar exige autorización del administrador */
function entityModal(col,rec,preset){
  const sp=SPEC[col],isNew=!rec,pre=Object.fromEntries(Object.entries(preset||{}).filter(([k,x])=>x!==undefined));
  const v={...sp.def,...(isNew&&!sp.global?{date:today()}:{}),...pre,...(rec||{})};
  const label=rec?.name||rec?.title||rec?.tag||rec?.code||'';
  const fields=sp.fields.filter(f=>!f.admin||isAdmin());
  const extra=sp.extra?sp.extra(rec):'';
  modal((isNew?'Nuevo registro: ':'Editar: ')+sp.title,`${sp.code?`<div class="small muted">${MT(sp.code)}</div>`:''}<form class="frm" id="ef" novalidate>${fields.map(f=>fieldHTML(sp.prep&&f.t==='prep'?{...f,_type:v.type}:f,v[f.k])).join('')}<p class="err" id="ferr" hidden></p></form>${extra}`,footer(isNew),m=>{
    $('#ef').addEventListener('submit',e=>e.preventDefault());
    sp.mount&&sp.mount(m,v);
    $('#fsave').onclick=async()=>{const o=readForm(fields);const miss=fields.filter(f=>f.req&&!o[f.k]);if(miss.length)return showErr('Completa: '+miss.map(f=>f.l).join(', '));
      const id=rec?.id||uid(col.slice(0,3));const data={...(rec||{}),...o};delete data.id;
      if(!sp.global)data.projectId=rec?.projectId||S.pid;
      if(isNew){data.createdAt=nowISO();data.createdBy=S.session?.personId||'';data.createdByEmail=S.session?.email||''}
      const needAuth=!isNew||sp.adminOnly;
      busy(true,'Guardando…');
      try{const done=await authorize(needAuth?`${isNew?'Crear':'Modificar'} ${sp.title} «${o.name||o.title||o.tag||o.code||label}»`:null,async db=>{await save(col,id,data,db);sp.afterSave&&await sp.afterSave(id,data,db)});
        if(!done){busy(false);return}closeModal();toast(isNew?'Registro creado':'Cambios guardados')}
      catch(e){busy(false);showErr(errMsg(e))}};
    armDelete($('#fdel'),async()=>{if(sp.canDelete){const why=sp.canDelete(rec);if(why)throw new Error(why)}
      return await authorize(`Eliminar ${sp.title} «${label}»`,db=>removeDoc(col,rec.id,db))});
    if(isViewer())readonly(m);
  },sp.wide);
}

/* ---------- MOD-13.7 Eventos y arranque ---------- */
const VIEWER_ACTS=new Set(['export-open','tab','zoom','gantt-today','deps-toggle','collapse-all','filter-clear','filter-resp','group-toggle','logout','task-edit','codes-toggle']);
const MODAL_ACTS=['log-new','permit-new','permit-edit','eq-edit'];
Object.assign(ACT,{
  tab:id=>{S.view=id;lsSet('cp-view',id);closeModal();window.scrollTo(0,0);render()},
  'codes-toggle':()=>{S.showCodes=!S.showCodes;lsSet('cp-codes',S.showCodes?'1':'0');render()},
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(!a)return;e.preventDefault();
  if(isViewer()&&!VIEWER_ACTS.has(el.dataset.act))return toast('Tu acceso es solo de consulta del avance.');
  if(el.closest('#modal')&&!MODAL_ACTS.includes(el.dataset.act))return;
  if(el.closest('#modal'))closeModal();a(el.dataset.id,el,e)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='projSel'){S.pid=t.value;lsSet('cp-pid',t.value);S.gInit=false;S.f={front:'',resp:'',site:'',status:'',q:''};render();return}
  if(t.dataset.pf!=null){S.pf[t.dataset.pf]=t.value;render();return}
  if(t.dataset.f!=null&&t.dataset.f!=='q'){S.f[t.dataset.f]=t.value;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){S.f.q=t.value;clearTimeout(S.qT);S.qT=setTimeout(render,180)}});
let wasNarrow=matchMedia('(max-width:760px)').matches;addEventListener('resize',()=>{const n=matchMedia('(max-width:760px)').matches;if(n!==wasNarrow){wasNarrow=n;render()}});
{const h=(location.hash||'').slice(1),v=lsGet('cp-view');S._initialView=h||v||'tablero'}
function iniciarSistema(){
  VIEWS_LIST.sort((a,b)=>a[2]-b[2]);
  if(VIEWS_LIST.some(x=>x[0]===S._initialView))S.view=S._initialView;
  conectarDatos();   // MOD-10
}

</script>
<script>
/* ===== js/mod10-datos.js ===== */
/* =====================================================================
   MOD-10 · NÚCLEO DE DATOS (FIREBASE)
   Secciones:
     MOD-10.1 Conexión con Firebase y modo demostración  (config en firebase-config.js)
     MOD-10.2 Sesión: ingreso SOLO con PIN validado desde la página, e instalación inicial
     MOD-10.3 Lectura en tiempo real de las colecciones
     MOD-10.4 Escritura: guardar, actualizar, eliminar (con o sin autorización)
     MOD-10.5 Credenciales de administrador para autorizar cambios en otro equipo
     MOD-10.6 Ingresos: crear, cambiar y retirar PIN
     MOD-10.7 Mensajes de error comprensibles
   Colecciones Firestore: projects, people, tasks, logs, permits, equipment,
   changes, audit, config, access (una ficha por PIN: rol, nombre y saludo),
   sesiones (una por pestaña abierta).
   v4.0.0 (SC-2026-017): no se crean usuarios ni correos en Firebase; todo se
   hace desde la página (index). Basta activar el acceso «Anónimo».
   Toda la información es texto: el sistema no almacena fotos ni documentos.
   ===================================================================== */

/* ---------- MOD-10.1 Conexión ---------- */
let DB=null,AUTH=null,UNSUB=[];
const DEMO=typeof FIREBASE_CONFIG==='undefined'||!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='REEMPLAZAR';
const clean=o=>JSON.parse(JSON.stringify(o));
function conectarDatos(){
  if(DEMO){
    S.demo=true;S.ready=true;S.session={name:'Modo demostración',role:'admin',personId:'',email:'demo@local'};
    banner('<b>Modo demostración.</b> No hay conexión con Firebase: los cambios no se guardan al recargar. Configura <code>js/firebase-config.js</code> para trabajar en línea. Puedes importar un respaldo desde la pestaña Proyecto.');
    render();return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth();DB=firebase.firestore();
  DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});      // trabajo con señal débil en campo
  AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION);        // el PIN se pide en cada ingreso al sistema
  AUTH.onAuthStateChanged(onSesion);
}

/* ---------- MOD-10.2 Sesión (v4.0.0 · SC-2026-017: todo desde la página) ----------
   No hay usuarios ni correos en Firebase. Cada pestaña abre una sesión anónima
   y el PIN se valida contra la colección access (id = resumen SHA-256 del PIN;
   el PIN nunca se guarda). La sesión queda en sesiones/{uid} y las reglas
   (MOD-12.1) dan el rol según el PIN, de modo que un PIN retirado deja de
   funcionar al instante. */
async function claveDePin(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cp-pin|'+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function leerPerfil(db,uid){
  const ses=await db.collection('sesiones').doc(uid).get();if(!ses.exists)return null;
  const k=ses.data().pinKey,acc=await db.collection('access').doc(k).get();
  return acc.exists?{key:k,...acc.data()}:null}
async function onSesion(u){
  if(!u){try{await AUTH.signInAnonymously()}catch(e){showGate(/operation-not-allowed|admin-restricted/.test(e?.code||'')?errMsg(e):'No se pudo conectar con el servidor: '+errMsg(e))}return}
  try{
    const a=await leerPerfil(DB,u.uid).catch(()=>null);
    if(!a){pararLecturas();S.session=null;S.ready=true;renderBar();$('#view').innerHTML='';
      let inst;try{inst=await DB.collection('instalacion').doc('estado').get()}
      catch(e){showGate(e?.code==='permission-denied'?'Faltan las reglas de seguridad en Firebase (Firestore → Reglas → pegar y Publicar).':'No se pudo conectar con el servidor: '+errMsg(e));return}
      if(!inst.exists)showInstalacion();else showGate();return}
    if(!a.role||a.role==='none'){await cerrarSesion();showGate('Este PIN no tiene acceso al sistema. Consulta al administrador.');return}
    S.session={email:u.uid,uid:u.uid,pinKey:a.key,personId:a.personId||'',role:a.role,name:a.name||'Usuario',greet:a.greet||'Bienvenido'};
    iniciarLecturas();
    if(S.justLogged){S.justLogged=false;welcome(S.session);audit('Ingreso',ROLES[a.role]||'')}
    else hideGate();
  }catch(e){showGate('No se pudo validar tu acceso: '+errMsg(e))}
}
async function abrirSesionConPin(app,pin){   // devuelve el perfil del PIN o lanza «PIN incorrecto»
  const au=app.auth();if(!au.currentUser)await au.signInAnonymously();
  const uid=au.currentUser.uid,key=await claveDePin(pin);
  try{await app.firestore().collection('sesiones').doc(uid).set({pinKey:key,at:nowISO()})}
  catch(e){if(e?.code==='permission-denied')throw{code:'pin-incorrecto'};throw e}
  const a=await leerPerfil(app.firestore(),uid);if(!a)throw{code:'pin-incorrecto'};return{uid,...a}}
async function loginConPin(pin){await abrirSesionConPin(firebase.app(),pin);await onSesion(AUTH.currentUser)}
async function cerrarSesion(){pararLecturas();const uid=S.session?.uid;S.session=null;
  if(AUTH&&uid){try{await DB.collection('sesiones').doc(uid).delete()}catch(e){}}
  if(AUTH){renderBar();$('#view').innerHTML='';showGate()}else showGate()}
/* Instalación inicial: la primera vez, el propio index crea el PIN del administrador */
async function instalarSistema(nombre,pin,greet){
  const uid=AUTH.currentUser.uid,key=await claveDePin(pin),b=DB.batch();
  b.set(DB.collection('instalacion').doc('estado'),{at:nowISO(),version:SISTEMA.version});
  b.set(DB.collection('access').doc(key),{role:'admin',personId:'p-lider',name:nombre,greet});
  b.set(DB.collection('sesiones').doc(uid),{pinKey:key,at:nowISO()});
  await b.commit();
  await DB.collection('people').doc('p-lider').set({name:nombre,role:'Jefe de proyecto',type:'Interno',company:'',phone:'',active:true,access:'admin',loginId:'pin',greet,updatedAt:nowISO(),updatedBy:'p-lider'},{merge:true});
}

/* ---------- MOD-10.3 Lectura en tiempo real ---------- */
function iniciarLecturas(){
  pararLecturas();S.loaded={};S.ready=false;const need=['projects','people','tasks'];
  COLS.forEach(c=>{if(c==='audit'&&S.session.role!=='admin')return;
    UNSUB.push(DB.collection(c).onSnapshot(s=>{S.data[c]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[c]=true;if(!S.ready&&need.every(x=>S.loaded[x]))S.ready=true;schedule()},
      e=>{S.loaded[c]=true;if(need.every(x=>S.loaded[x]))S.ready=true;banner('No se pudo leer '+esc(c)+': '+esc(errMsg(e)));schedule()}))});
  setTimeout(()=>{if(!S.ready){S.ready=true;schedule()}},8000);
}
function pararLecturas(){UNSUB.forEach(f=>{try{f()}catch(e){}});UNSUB=[];COLS.forEach(c=>S.data[c]=[])}

/* ---------- MOD-10.4 Escritura ---------- */
function localUpsert(col,id,data,merge){const a=S.data[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=merge?{...a[i],...data}:{id,...data};else a.push({id,...data});schedule()}
const sello=d=>clean({...d,updatedAt:nowISO(),updatedBy:S.session?.personId||''});
async function escribir(p){   // con señal débil la escritura queda en cola en el equipo y se envía al volver la conexión
  const r=await Promise.race([p.then(()=>'ok'),new Promise(res=>setTimeout(()=>res('cola'),6000))]);
  if(r==='cola'){toast('Sin señal: el registro quedó guardado en este equipo y se enviará al recuperar la conexión.');p.catch(e=>toast(errMsg(e)))}
}
async function save(col,id,data,db){data=sello(data);if(S.demo)return localUpsert(col,id,data,false);await escribir((db||DB).collection(col).doc(id).set(data))}
async function patch(col,id,data,db){data=sello(data);if(S.demo)return localUpsert(col,id,data,true);await escribir((db||DB).collection(col).doc(id).update(data))}
async function removeDoc(col,id,db){if(S.demo){S.data[col]=S.data[col].filter(x=>x.id!==id);schedule();return}await escribir((db||DB).collection(col).doc(id).delete())}
async function audit(type,detail){try{await save('audit',uid('aud'),{projectId:S.pid||'',type,detail:detail||'',personId:S.session?.personId||'',byEmail:S.session?.email||'',at:nowISO()})}catch(e){}}

/* ---------- MOD-10.5 Autorización con PIN del administrador en el equipo de otra persona ---------- */
function appSecundaria(nombre){return firebase.apps.find(a=>a.name===nombre)||firebase.initializeApp(FIREBASE_CONFIG,nombre)}
async function sesionAdministrador(pin){
  const app=appSecundaria('autoriza');await app.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
  const fin=async()=>{try{const u=app.auth().currentUser;if(u)await app.firestore().collection('sesiones').doc(u.uid).delete()}catch(e){}await app.auth().signOut().catch(()=>{})};
  let a;try{a=await abrirSesionConPin(app,pin)}catch(e){await fin();throw e.code==='pin-incorrecto'?{code:'no-admin'}:e}
  if(a.role!=='admin'){await fin();throw{code:'no-admin'}}
  return{db:app.firestore(),fin,name:a.name||'Administrador'};
}

/* ---------- MOD-10.6 Ingresos y cambio de PIN (v4.0.0 · SC-2026-017) ----------
   Asignar un PIN crea su ficha en access desde la página; el PIN anterior de
   esa persona se elimina y deja de funcionar. Solo el administrador. */
async function accesosDe(personId){const s=await DB.collection('access').get();return s.docs.filter(d=>d.data().personId===personId).map(d=>d.id)}
async function asignarPin(persona,pin,role,greet){
  const key=await claveDePin(pin);
  if(!S.demo){const ya=await DB.collection('access').doc(key).get();if(ya.exists&&ya.data().personId!==persona.id)throw{code:'pin-usado'}}
  await save('access',key,{role,personId:persona.id,name:persona.name,greet});
  if(!S.demo&&persona.id===S.session?.personId){await DB.collection('sesiones').doc(S.session.uid).set({pinKey:key,at:nowISO()});S.session.pinKey=key}
  if(!S.demo)for(const k of await accesosDe(persona.id))if(k!==key)await removeDoc('access',k);
  await patch('people',persona.id,{loginId:'pin',access:role,greet});
}
async function actualizarAcceso(persona,role,greet){
  if(!S.demo)for(const k of await accesosDe(persona.id))await patch('access',k,{role,name:persona.name,greet});
  await patch('people',persona.id,{access:role,greet});
}
async function quitarIngreso(persona){
  if(!S.demo)for(const k of await accesosDe(persona.id))await removeDoc('access',k);
  await patch('people',persona.id,{loginId:'',access:'none'});
}

/* ---------- MOD-10.7 Mensajes de error ---------- */
function errMsg(e){const c=e?.code||'';
  return({'permission-denied':'No tienes permiso para este cambio. Debe autorizarlo el administrador.','unavailable':'Sin conexión con el servidor. Revisa la señal e intenta de nuevo.',
    'auth/invalid-credential':'PIN incorrecto.','auth/wrong-password':'PIN incorrecto.','auth/invalid-login-credentials':'PIN incorrecto.','auth/user-not-found':'Usuario no registrado.',
    'auth/too-many-requests':'Demasiados intentos. Espera unos minutos antes de volver a intentar.','auth/network-request-failed':'Sin conexión a internet.',
    'auth/email-already-in-use':'Ese PIN no está disponible. Usa o genera otro.','auth/weak-password':'El PIN debe tener 6 dígitos.','no-admin':'Ese PIN no corresponde al administrador.','pin-incorrecto':'PIN incorrecto.','pin-usado':'Ese PIN ya lo usa otra persona. Elige otro.','auth/operation-not-allowed':'Falta activar el acceso «Anónimo» en Firebase (Authentication → Método de acceso).','auth/admin-restricted-operation':'Falta activar el acceso «Anónimo» en Firebase (Authentication → Método de acceso).',
    'resource-exhausted':'Se alcanzó el límite del plan de Firebase. Intenta más tarde.'})[c]||(e?.message||String(e));
}

</script>
<script>
/* ===== js/mod01-acceso.js ===== */
/* =====================================================================
   MOD-01 · ACCESO, PIN, BIENVENIDA Y AUTORIZACIONES
   Secciones:
     MOD-01.1 Roles y permisos de pantalla
     MOD-01.2 Pantalla de ingreso (solo PIN de 6 dígitos)
     MOD-01.3 Mensaje de bienvenida
     MOD-01.4 Autorización con PIN del administrador para modificar
     MOD-01.5 Cierre de sesión e inactividad (30 min)
     MOD-01.6 Instalación inicial desde la página (v4.0.0)
   v2.0.0 (SC-2026-001): se ingresa solo con el PIN, sin elegir el nombre.
   Reglas: crear registros no requiere PIN del administrador; modificar o
   eliminar sí. Ulices (rol "viewer") solo ve Tablero y Cronograma.
   La regla equivalente en el servidor está en firestore.rules (MOD-12).
   ===================================================================== */

/* ---------- MOD-01.1 Roles ---------- */
const role=()=>S.session?.role||'none';
const isAdmin=()=>role()==='admin';
const isViewer=()=>role()==='viewer';

/* ---------- MOD-01.2 Pantalla de ingreso: solo PIN (v2.0.0, SC-2026-001) ---------- */
function hideGate(){const g=$('#gate');g.hidden=true;g.innerHTML='';g.dataset.mode=''}
function showGate(msg){
  const g=$('#gate');
  if(!g.hidden&&g.dataset.mode==='pin'&&!msg)return;
  g.dataset.mode='pin';g.hidden=false;closeModal();
  let pin='',enviando=false;
  g.innerHTML=`<div class="gate-in"><div class="mark" aria-hidden="true">CP</div><div class="eyebrow">Control de proyectos de mantenimiento ${MT('MOD-01.2')}</div><h1>Ingreso al sistema</h1>
   <p class="muted" style="margin:6px 0 0">Ingresa tu PIN personal de 6 dígitos</p><div class="dots" id="gdots" aria-live="polite">${'<i></i>'.repeat(6)}</div><p class="err" id="gerr" ${msg?'':'hidden'}>${esc(msg||'')}</p>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="del" aria-label="Borrar">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok">Ingresar</button></div>
   <p class="hint">¿Olvidaste tu PIN? Solicítalo al administrador del proyecto.</p></div>`;
  const dots=()=>$$('#gdots i').forEach((d,i)=>d.classList.toggle('on',i<pin.length));
  const err=m=>{const e=$('#gerr');e.textContent=m;e.hidden=!m};
  const go=async()=>{if(pin.length!==6)return err('El PIN tiene 6 dígitos.');if(enviando)return;
    enviando=true;err('');const p=pin;pin='';dots();
    try{S.justLogged=true;await loginConPin(p)}catch(e){S.justLogged=false;err(errMsg(e))}finally{enviando=false}};
  const key=k=>{err('');if(k==='del')pin=pin.slice(0,-1);else if(k==='ok')return go();else if(pin.length<6){pin+=k;if(pin.length===6){dots();return go()}}dots()};
  g.querySelector('.pad').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
  document.onkeydown=e=>{if(g.hidden||g.dataset.mode!=='pin')return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok')};
}

/* ---------- MOD-01.6 Instalación inicial desde la página (v4.0.0 · SC-2026-017) ----------
   Solo aparece la primera vez, cuando la base de datos está vacía: quien abre
   el index crea su nombre y su PIN de administrador. Después ya no se muestra. */
function showInstalacion(){
  const g=$('#gate');g.dataset.mode='instalar';g.hidden=false;closeModal();
  g.innerHTML=`<div class="gate-in" style="text-align:left"><div class="mark" aria-hidden="true">CP</div><div class="eyebrow">Primera vez ${MT('MOD-01.6')}</div><h1>Instalación inicial</h1>
   <p class="muted">La base de datos está vacía. Crea el ingreso del <b>administrador del proyecto</b>. Este paso se hace una sola vez.</p>
   <div class="frm"><div class="fld full"><label for="in_nom">Nombre del administrador</label><input id="in_nom" autocomplete="off"></div>
    <div class="fld full"><label for="in_greet">Saludo</label><select id="in_greet"><option>Bienvenido</option><option>Bienvenida</option></select></div>
    <div class="fld half"><label for="in_pin">PIN (6 dígitos)</label><input id="in_pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <div class="fld half"><label for="in_pin2">Repite el PIN</label><input id="in_pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div></div>
   <p class="err" id="in_err" hidden></p><button class="btn primary" id="in_ok" style="width:100%;justify-content:center;margin-top:10px">Crear administrador e ingresar</button></div>`;
  const err=m=>{const e=$('#in_err');e.textContent=m;e.hidden=!m};
  $('#in_ok').onclick=async()=>{const nom=$('#in_nom').value.trim(),pin=$('#in_pin').value.trim(),greet=$('#in_greet').value;
    if(nom.length<3)return err('Escribe el nombre del administrador.');
    if(!/^\d{6}$/.test(pin))return err('El PIN debe tener exactamente 6 dígitos.');
    if(typeof pinTrivial==='function'&&pinTrivial(pin))return err('Ese PIN es muy fácil de adivinar (repetido o consecutivo). Usa otro.');
    if(pin!==$('#in_pin2').value.trim())return err('Los dos PIN no coinciden.');
    $('#in_ok').disabled=true;err('');
    try{await instalarSistema(nom,pin,greet);S.justLogged=true;await onSesion(AUTH.currentUser)}
    catch(e){$('#in_ok').disabled=false;err(e?.code==='permission-denied'?'El sistema ya fue instalado. Recarga la página e ingresa con tu PIN.':errMsg(e))}};
  setTimeout(()=>$('#in_nom').focus(),30);
}

/* ---------- MOD-01.3 Bienvenida ---------- */
function welcome(s){
  const g=$('#gate');g.dataset.mode='welcome';g.hidden=false;
  g.innerHTML=`<div class="gate-in welcome"><div class="mark" aria-hidden="true">CP</div><h1>${esc(s.greet||'Bienvenido')}, ${esc(s.name)}</h1>
   <p class="wl">Cada aporte es importante para este proyecto.</p><p class="wl strong">¡Gracias, equipo!</p>
   <p class="muted small">${esc(ROLES[s.role]||'')}</p><button class="btn primary" id="gstart" style="min-width:200px;justify-content:center">Comenzar</button></div>`;
  const tk=String(Date.now()+Math.random());g.dataset.tk=tk;
  const done=()=>{if(g.dataset.mode==='welcome'&&g.dataset.tk===tk)hideGate()};
  $('#gstart').onclick=done;$('#gstart').focus();setTimeout(done,6000);
  if(isViewer()&&!VIEWER_TABS.includes(S.view))S.view='tablero';
}

/* ---------- MOD-01.4 Autorización con PIN del administrador ----------
   authorize(etiqueta, fn): si quien usa el sistema es administrador, o la acción
   no requiere autorización (etiqueta vacía), ejecuta fn(null) con su propia sesión.
   Si no, pide el PIN del administrador, abre una sesión temporal de administrador
   solo para esa operación, ejecuta fn(db) y la cierra. Queda registro en auditoría. */
async function authorize(label,fn){
  if(!label||isAdmin()||S.demo){await fn(null);return true}
  if(isViewer()){toast('Tu acceso es solo de consulta del avance.');return false}
  return await new Promise(res=>{const a=$('#auth');a.hidden=false;
    a.innerHTML=`<div class="ov"><div class="dlg sm" role="dialog" aria-modal="true" aria-label="Autorización requerida"><header><h3>Autorización del administrador ${MT('MOD-01.4')}</h3></header>
     <div class="dlg-body"><p>Este cambio requiere el PIN del administrador del proyecto:</p><p><b>${esc(label)}</b></p>
     <div class="fld"><label for="apin">PIN del administrador</label><input id="apin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div><p class="err" id="aerr" hidden></p>
     <p class="hint">Queda registrado quién solicitó el cambio y quién lo autorizó.</p></div>
     <footer><span class="sp"></span><button class="btn" id="acan">Cancelar</button><button class="btn primary" id="aok">Autorizar</button></footer></div></div>`;
    const close=v=>{a.hidden=true;a.innerHTML='';res(v)};
    const err=m=>{const e=$('#aerr');e.textContent=m;e.hidden=!m};
    $('#acan').onclick=()=>close(false);
    const ok=async()=>{const pin=$('#apin').value.trim();if(!/^\d{6}$/.test(pin))return err('El PIN tiene 6 dígitos.');
      $('#aok').disabled=true;err('');let ses=null;
      try{ses=await sesionAdministrador(pin)}catch(e){$('#aok').disabled=false;$('#apin').value='';return err(errMsg(e))}
      try{await fn(ses.db);await audit('Cambio autorizado con PIN',`${label} · solicitó ${S.session?.name||''} · autorizó ${ses.name}`);close(true)}
      catch(e){err(errMsg(e));$('#aok').disabled=false}
      finally{ses.fin()}};
    $('#aok').onclick=ok;$('#apin').onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')close(false)};setTimeout(()=>$('#apin').focus(),30)});
}

/* ---------- MOD-01.5 Salida e inactividad ---------- */
let ultimaActividad=Date.now();
['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>ultimaActividad=Date.now(),{passive:true}));
setInterval(()=>{if(S.session&&!S.demo&&Date.now()-ultimaActividad>30*60000){audit('Salida por inactividad','');cerrarSesion();toast('Sesión cerrada por 30 minutos sin uso.')}},60000);
ACT.logout=async()=>{if(S.demo)return toast('En modo demostración no hay sesión.');await audit('Salida','');closeModal();cerrarSesion()};

</script>
<script>
/* ===== js/mod02-tablero.js ===== */
/* =====================================================================
   MOD-02 · TABLERO DE RESUMEN
   Secciones:
     MOD-02.1 Indicadores (avance real vs plan, SPI, atrasos, pronóstico, autorizaciones)
     MOD-02.2 Curva S (planificado vs real)
     MOD-02.3 Avance por frente de trabajo
     MOD-02.4 Requiere atención (atrasadas, en riesgo, bloqueadas, incidencias)
     MOD-02.5 Carga por responsable
     MOD-02.6 Próximos 14 días
     MOD-02.7 Últimos avances de campo
   Visible para todos los roles, incluido "Solo resumen de avance".
   ===================================================================== */
VIEWS_LIST.push(['tablero','Tablero',1]);

VIEWS.tablero=function(){
  const k=kpis(),dev=k.real-k.plan,spiC=k.spi>=0.98?'t-ok':k.spi>=0.85?'t-warn':'t-crit';
  if(!k.n)return `<div class="card empty"><b>El proyecto no tiene actividades</b>${isAdmin()?'Agrega la primera actividad para ver el avance.<div style="margin-top:12px"><button class="btn primary" data-act="task-new">+ Agregar actividad</button></div>':''}</div>`;
  return `<div class="small muted">${MT('MOD-02.1')}</div><section class="kpis">
    <div class="kpi big"><div class="lbl">Avance real ponderado</div><div class="num">${pct(k.real)}%</div><div class="meter"><span style="width:${k.real}%"></span><i style="left:${k.plan}%" title="Planificado a hoy"></i></div>
      <div class="sub">Planificado a hoy <b>${pct(k.plan)}%</b> · desvío <b class="${dev<-5?'t-crit':dev<0?'t-warn':'t-ok'}">${dev>=0?'+':''}${pct(dev)} pts</b> (línea vertical = plan)</div></div>
    <div class="kpi"><div class="lbl">SPI · índice de plazo</div><div class="num ${k.plan>0?spiC:''}">${k.plan>0?k.spi.toFixed(2):'—'}</div><div class="sub">${k.plan>0?'Real ÷ planificado. 1,00 = en plazo':'Se calcula cuando inicie la primera actividad planificada'}</div></div>
    <div class="kpi"><div class="lbl">Actividades completadas</div><div class="num">${k.done}<span class="muted" style="font-size:20px"> / ${k.n}</span></div><div class="sub">${k.active} en ejecución · ${k.pending} por iniciar</div></div>
    <div class="kpi ${k.late?'crit':''}"><div class="lbl">Atrasadas</div><div class="num">${k.late}</div><div class="sub">${k.delayDays} días de retraso acumulado · ${k.risk} en riesgo · ${k.blocked} bloqueadas</div></div>
    <div class="kpi ${k.slip>0?'warn':''}"><div class="lbl">Fin plan → fin pronosticado</div><div class="num sm">${fmt(ds(k.end))} → ${fmt(ds(k.fend))}</div><div class="sub">${k.slip>0?`<b class="t-crit">${k.slip} días de desfase</b>`:'Sin desfase proyectado'}</div></div>
    <div class="kpi ${k.permOver?'crit':k.perm?'warn':''}"><div class="lbl">Autorizaciones por gestionar</div><div class="num">${k.perm}</div><div class="sub">próximos 7 días${k.permOver?` · <b class="t-crit">${k.permOver} vencidas</b>`:''} · ${k.incid} incidencias abiertas</div></div>
  </section>
  <div class="grid2">
    <section class="card"><h2>Curva S · avance acumulado ${MT('MOD-02.2')}</h2>${curvaS()}</section>
    <section class="card"><h2>Avance por frente de trabajo ${MT('MOD-02.3')}</h2><div class="list">${barrasFrente()}</div></section>
  </div>
  <div class="grid2">
    <section class="card"><h2>Requiere atención ${MT('MOD-02.4')}</h2>${atencion()}</section>
    <section class="card"><h2>Carga por responsable ${MT('MOD-02.5')}</h2>${carga()}</section>
  </div>
  <div class="grid2">
    <section class="card"><h2>Próximos 14 días ${MT('MOD-02.6')}</h2>${proximos()}</section>
    <section class="card"><div class="sec-h"><h2>Últimos avances de campo ${MT('MOD-02.7')}</h2>${isViewer()?'':'<button class="btn sm" data-act="tab" data-id="avances">Ver bitácora</button>'}</div>${ultimosAvances(8)}</section>
  </div>`;
};

/* MOD-02.2 */
function curvaS(){
  const L=C.list;if(!L.length)return '';
  const T=TD(),sd=L.reduce((a,c)=>a+c.dur,0),d0=Math.min(...L.map(c=>c.s)),d1=Math.max(...L.map(c=>Math.max(c.e,c.fe)),Math.min(T,d0+400));
  const logs=of('logs').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.createdAt).localeCompare(String(b.createdAt)));
  const byT={};logs.forEach(l=>{(byT[l.taskId]=byT[l.taskId]||[]).push(l)});
  const W=640,H=240,l=38,r=14,t=12,b=30,span=Math.max(1,d1-d0);
  const X=d=>l+(d-d0)/span*(W-l-r),Y=v=>H-b-(v/100)*(H-t-b);
  const pp=[],ap=[];
  for(let d=d0;d<=d1;d++){let p=0;for(const c of L)p+=(d<c.s?0:d>=c.e?1:(d-c.s+1)/c.dur)*c.dur;pp.push(`${X(d).toFixed(1)},${Y(p/sd*100).toFixed(1)}`);
    if(d<=T){let a=0;for(const c of L){let v=0;if(d===T)v=c.prog;else{const ls=byT[c.id];if(ls)for(const x of ls){if(dn(x.date)<=d)v=+x.progress||0}}a+=v*c.dur}ap.push(`${X(d).toFixed(1)},${Y(a/sd).toFixed(1)}`)}}
  let g='';for(const v of[0,25,50,75,100])g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}%</text>`;
  const step=Math.max(7,Math.ceil(span/7/7)*7);let xt='';
  for(let d=d0;d<=d1;d+=step)xt+=`<text x="${X(d)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmt(ds(d))}</text><line x1="${X(d)}" x2="${X(d)}" y1="${H-b}" y2="${H-b+4}" stroke="var(--line)"/>`;
  const tl=T>=d0&&T<=d1?`<line x1="${X(T)}" x2="${X(T)}" y1="${t}" y2="${H-b}" stroke="var(--today)" stroke-dasharray="3 3"/><text x="${X(T)+4}" y="${t+10}" font-size="10" fill="var(--today)">hoy</text>`:'';
  const last=ap.length?ap[ap.length-1].split(','):null;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S planificada versus real">${g}${xt}${tl}
    <polyline points="${pp.join(' ')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    ${ap.length?`<polygon points="${X(d0)},${Y(0)} ${ap.join(' ')} ${X(Math.min(T,d1))},${Y(0)}" fill="var(--accent)" opacity=".12"/><polyline points="${ap.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`:''}
    ${last?`<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:''}</svg>
    <div class="legend"><span><i class="d" style="--c:var(--muted)"></i>Planificado (línea base)</span><span><i style="--c:var(--accent)"></i>Real (según registros de avance)</span></div></div>`;
}
/* MOD-02.3 */
function barrasFrente(){return fronts().map((f,i)=>{const cs=C.list.filter(c=>c.t.front===f);if(!cs.length)return '';const sd=cs.reduce((a,c)=>a+c.dur,0),r=cs.reduce((a,c)=>a+c.prog*c.dur,0)/sd,p=cs.reduce((a,c)=>a+c.planned*c.dur,0)/sd;
  const late=cs.filter(c=>c.st==='late').length,done=cs.filter(c=>c.st==='done').length;
  return `<div class="fb"><div class="fb-h"><span class="sw" style="--c:${fcol(i+1)}"></span><span class="fb-n">${i+1}. ${esc(f)}</span><span class="fb-v">${pct(r)}%</span></div>
   <div class="meter sm"><span style="width:${r}%;background:${fcol(i+1)}"></span><i style="left:${p}%"></i></div>
   <div class="fb-s">${done}/${cs.length} completadas · plan a hoy ${pct(p)}%${late?` · <b class="t-crit">${late} atrasada${late>1?'s':''}</b>`:''}</div></div>`}).join('')}
/* MOD-02.4 */
function atencion(){
  const rows=C.list.filter(c=>['late','risk','blocked'].includes(c.st)).sort((a,b)=>b.delay-a.delay||(b.planned-b.prog)-(a.planned-a.prog));
  const inc=of('logs').filter(l=>l.issue&&!l.issueResolved);
  if(!rows.length&&!inc.length)return `<div class="empty"><b>Todo en orden</b>No hay actividades atrasadas, en riesgo ni incidencias abiertas.</div>`;
  return `<div class="list">${inc.map(l=>`<div class="li"><span class="chip crit">Incidencia</span><div class="body"><div class="t">${esc(tlabel(l.taskId))}</div><div class="m">${esc(l.issueText||l.note)} · ${esc(pname(l.personId))}, ${fmt(l.date)}</div></div><div class="r">${isViewer()?'':`<button class="btn sm" data-act="issue-resolve" data-id="${esc(l.id)}">Marcar resuelta</button>`}</div></div>`).join('')}
  ${rows.slice(0,12).map(c=>`<div class="li click" data-act="task-edit" data-id="${esc(c.id)}">${chip(c.st)}<div class="body"><div class="t">${c.wbs} ${esc(c.t.name)}</div><div class="m">${esc(pshort(c.t.respId))} · fin ${fmt(c.t.end)} · ${c.prog}% real vs ${c.planned}% plan${c.st==='blocked'?' · espera: '+c.preds.filter(p=>(+p.progress||0)<100).map(p=>C.map[p.id]?.wbs).join(', '):''}</div></div><div class="r">${c.delay?`<b class="t-crit">+${c.delay} d</b>`:''}</div></div>`).join('')}</div>`;
}
/* MOD-02.5 */
function carga(){
  const m={};C.list.forEach(c=>{const id=c.t.respId||'_';(m[id]=m[id]||{n:0,act:0,late:0,sum:0});const o=m[id];o.n++;o.sum+=c.prog;if(c.st==='late')o.late++;if(c.st!=='done'&&c.st!=='pending')o.act++});
  const ids=Object.keys(m).sort((a,b)=>m[b].late-m[a].late||m[b].act-m[a].act);
  return `<div class="tw"><table class="tbl"><thead><tr><th>Responsable</th><th>Asignadas</th><th>En curso</th><th>Atrasadas</th><th>Avance prom.</th></tr></thead><tbody>${ids.map(id=>`<tr class="click" data-act="filter-resp" data-id="${esc(id)}"><td>${id==='_'?'<span class="t-crit">Sin asignar</span>':esc(pname(id))}</td><td class="n">${m[id].n}</td><td class="n">${m[id].act}</td><td class="n ${m[id].late?'t-crit':''}">${m[id].late}</td><td class="n">${pct(m[id].sum/m[id].n)}%</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin:8px 0 0">Toca una fila para ver sus actividades en el cronograma.</p>`;
}
/* MOD-02.6 */
function proximos(){
  const T=TD(),ev=[];
  C.list.forEach(c=>{if(c.st==='done')return;if(c.s>=T&&c.s<=T+14)ev.push({d:c.s,k:'Inicia',c});if(c.e>=T&&c.e<=T+14)ev.push({d:c.e,k:'Vence',c})});
  of('permits').forEach(p=>{const d=dn(p.date);if(d!=null&&d>=T&&d<=T+14&&!['Cerrado','Rechazado'].includes(p.status))ev.push({d,k:'Autorización',p})});
  ev.sort((a,b)=>a.d-b.d);
  if(!ev.length)return `<div class="empty"><b>Sin hitos próximos</b>Nada inicia ni vence en las próximas dos semanas.</div>`;
  return `<div class="list">${ev.slice(0,14).map(e=>e.p?`<div class="li ${isViewer()?'':'click'}" data-act="permit-edit" data-id="${esc(e.p.id)}"><span class="chip ${PERMIT_CLS[e.p.status]||'idle'}">${esc(e.p.status)}</span><div class="body"><div class="t">${esc(e.p.type)}</div><div class="m">${esc(e.p.title)}${e.p.area?' · '+esc(e.p.area):''}</div></div><div class="r mono">${fmt(ds(e.d))}</div></div>`
    :`<div class="li click" data-act="task-edit" data-id="${esc(e.c.id)}"><span class="chip ${e.k==='Vence'?'warn':'info'}">${e.k}</span><div class="body"><div class="t">${e.c.wbs} ${esc(e.c.t.name)}</div><div class="m">${esc(pshort(e.c.t.respId))} · ${e.c.prog}%</div></div><div class="r mono">${fmt(ds(e.d))}</div></div>`).join('')}</div>`;
}
/* MOD-02.7 */
function ultimosAvances(n){
  const L=of('logs').slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  if(!L.length)return `<div class="empty"><b>Sin registros todavía</b>Los técnicos registran el avance en texto con «+ Registrar avance» y aparece aquí.</div>`;
  return `<div class="list">${L.slice(0,n).map(registroLi).join('')}</div>`;
}
function registroLi(l){return `<div class="li"><span class="chip ${+l.progress>=100?'ok':'acc'}">${+l.prevProgress||0}→${+l.progress}%</span><div class="body"><div class="t">${esc(tlabel(l.taskId))}</div><div class="m">${fmt(l.date)} · ${esc(pname(l.personId))}</div><div style="white-space:pre-line">${esc(l.note)}</div>${l.issue?`<div class="small ${l.issueResolved?'muted':'t-crit'}"><b>Incidencia${l.issueResolved?' resuelta':''}:</b> ${esc(l.issueText)}</div>`:''}</div></div>`}
ACT['filter-resp']=id=>{S.f={front:'',resp:id==='_'?'':id,site:'',status:'',q:''};S.view='cronograma';render()};

</script>
<script>
/* ===== js/mod03-cronograma.js ===== */
/* =====================================================================
   MOD-03 · CRONOGRAMA (GANTT) Y TABLA DE CONTROL
   Secciones:
     MOD-03.1 Barra de filtros (frente, responsable, sede, estado, búsqueda)
     MOD-03.2 Diagrama de Gantt (barras, avance, retraso, vínculos, hoy)
              v2.1.1 (SC-2026-007): nombre completo en varias líneas; los vínculos
              se dibujan midiendo la altura real de cada fila.
     MOD-03.3 Tabla de control
     MOD-03.4 Formulario de actividad (crear / modificar / eliminar)
     MOD-03.5 Reprogramación automática por vínculos fin → inicio
     MOD-03.6 Exportación del cronograma a CSV
   Planificar (crear, cambiar fechas, responsables o vínculos) es del
   administrador; los demás lo hacen con su autorización (MOD-01.4).
   ===================================================================== */
VIEWS_LIST.push(['cronograma','Cronograma',2]);

/* MOD-03.1 */
function barraFiltros(extra){
  const fr=fronts();
  return `<div class="toolbar">${MT('MOD-03.1')}
   <input type="search" id="gq" data-f="q" placeholder="Buscar actividad…" value="${esc(S.f.q)}" aria-label="Buscar actividad">
   <select data-f="front" aria-label="Frente"><option value="">Todos los frentes</option>${fr.map((f,i)=>`<option value="${esc(f)}" ${S.f.front===f?'selected':''}>${i+1}. ${esc(f)}</option>`).join('')}</select>
   <select data-f="resp" aria-label="Responsable"><option value="">Todos los responsables</option>${peopleSorted().map(p=>`<option value="${esc(p.id)}" ${S.f.resp===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
   <select data-f="site" aria-label="Sede"><option value="">Todas las sedes</option>${SITES.map(s=>`<option ${S.f.site===s?'selected':''}>${s}</option>`).join('')}</select>
   <select data-f="status" aria-label="Estado"><option value="">Todos los estados</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${S.f.status===k?'selected':''}>${v[0]}</option>`).join('')}</select>
   ${Object.values(S.f).some(Boolean)?'<button class="btn sm ghost" data-act="filter-clear">Limpiar filtros</button>':''}
   <span class="sp"></span>${extra||''}</div>`;
}

/* MOD-03.2 */
VIEWS.cronograma=function(){
  if(!C.list.length)return `<div class="card empty"><b>Sin actividades</b>${isAdmin()?'Agrega actividades para construir el diagrama de Gantt.<div style="margin-top:12px"><button class="btn primary" data-act="task-new">+ Agregar actividad</button></div>':''}</div>`;
  const T=TD(),all=C.list,L=filtered(),fr=fronts();
  const r0=Math.min(...all.map(c=>c.s),T)-3,r1=Math.max(...all.map(c=>Math.max(c.e,c.fe)),T)+10;
  const dw={day:30,week:14,month:5}[S.zoom]||14,W=(r1-r0+1)*dw;S.g={r0,dw};
  const m0=r0+((1-dow(r0))+7)%7;
  let months='',subs='';
  for(let d=r0;d<=r1;d++){const dt=new Date(d*864e5),dd=dt.getUTCDate(),mm=dt.getUTCMonth(),yy=dt.getUTCFullYear();
    if(d===r0||dd===1){const dim=new Date(Date.UTC(yy,mm+1,0)).getUTCDate(),end=Math.min(r1,d+(dim-dd));months+=`<div class="mh" style="left:${(d-r0)*dw}px;width:${(end-d+1)*dw}px">${MESL[mm]} ${yy}</div>`}
    const wd=dow(d);
    if(S.zoom==='day')subs+=`<div class="dh ${wd===0||wd===6?'we':''}" style="left:${(d-r0)*dw}px;width:${dw}px">${dd}</div>`;
    else if(S.zoom==='week'&&wd===1)subs+=`<div class="dh" style="left:${(d-r0)*dw}px;width:${7*dw}px">${dd}/${mm+1}</div>`;
  }
  const permBy={};of('permits').forEach(p=>{if(p.taskId&&['Planificado','Solicitado'].includes(p.status))permBy[p.taskId]=(permBy[p.taskId]||0)+1});
  let rows='';const vis=new Set();
  fr.forEach((f,i)=>{const cs=L.filter(c=>c.t.front===f);if(!cs.length)return;const col=fcol(i+1),coll=S.collapsed[f];
    const gs=Math.min(...cs.map(c=>c.s)),ge=Math.max(...cs.map(c=>c.e)),sd=cs.reduce((a,c)=>a+c.dur,0),gp=cs.reduce((a,c)=>a+c.prog*c.dur,0)/sd;
    rows+=`<div class="g-grp" data-act="group-toggle" data-id="${esc(f)}" style="width:calc(var(--lw) + ${W}px)"><div class="g-left"><span aria-hidden="true">${coll?'▸':'▾'}</span><span class="nm"><span class="sw" style="--c:${col};margin-right:7px"></span>${i+1}. ${esc(f)}</span><span class="pc">${pct(gp)}%</span></div>
      <div class="g-tl" style="width:${W}px"><div class="bar-g" style="--c:${col};left:${(gs-r0)*dw}px;width:${(ge-gs+1)*dw}px"><span style="width:${gp}%"></span></div></div></div>`;
    if(coll)return;
    cs.forEach(c=>{const left=(c.s-r0)*dw,w=c.dur*dw;vis.add(c.id);
      const over=c.st==='late'?`<div class="bar-o" style="left:${(c.e+1-r0)*dw}px;width:${(T-c.e)*dw}px" title="Retraso"></div>`:(c.st==='done'&&c.delay?`<div class="bar-o" style="left:${(c.e+1-r0)*dw}px;width:${c.delay*dw}px"></div>`:'');
      const lblX=left+w+6+(c.st==='late'?(T-c.e)*dw:0);
      rows+=`<div class="g-row" data-act="task-edit" data-id="${esc(c.id)}" style="width:calc(var(--lw) + ${W}px)" title="${esc(c.wbs+' '+c.t.name)}">
        <div class="g-left"><span class="wbs">${c.wbs}</span><span class="nm">${esc(c.t.name)}${permBy[c.id]?`<span class="pt" title="${permBy[c.id]} autorización(es) pendiente(s)">PT</span>`:''}</span><span class="rs">${esc(pname(c.t.respId))}</span><span class="dt">${fmt(c.t.start)}</span><span class="dt">${fmt(c.t.end)}</span><span class="pc">${c.prog}%</span><span class="dl ${c.delay?'on':''}">${c.delay?'+'+c.delay:'0'}</span><span class="st">${chip(c.st)}</span></div>
        <div class="g-tl" style="width:${W}px"><div class="bar-p ${c.st==='late'?'crit':''}" style="--c:${col};left:${left}px;width:${w}px"><span style="width:${c.prog}%"></span></div>${over}<span class="bar-l" style="left:${lblX}px">${c.prog}% · ${esc(pshort(c.t.respId))}</span></div></div>`;
    });
  });
  const links=[];
  if(S.showDeps)L.forEach(c=>{if(!vis.has(c.id))return;(c.t.deps||[]).forEach(pid=>{const p=C.map[pid];if(!p||!vis.has(pid))return;
    links.push({from:pid,to:c.id,x1:(p.e+1-r0)*dw,x2:(c.s-r0)*dw,warn:p.prog<100&&T>=c.s})})});
  S.g.links=links;requestAnimationFrame(dibujarVinculos);
  return `<section class="card" style="padding:12px">${barraFiltros(`<div class="seg" role="group" aria-label="Escala">${[['day','Día'],['week','Semana'],['month','Mes']].map(([z,l])=>`<button aria-pressed="${S.zoom===z}" data-act="zoom" data-id="${z}">${l}</button>`).join('')}</div>
     <button class="btn sm" data-act="gantt-today">Ir a hoy</button><button class="btn sm" data-act="deps-toggle">${S.showDeps?'Ocultar':'Mostrar'} vínculos</button><button class="btn sm" data-act="collapse-all">${Object.values(S.collapsed).some(Boolean)?'Expandir':'Contraer'} frentes</button>`)}
    <p class="hint" style="margin:8px 0 0">${MT('MOD-03.2')} Barra = plan · relleno = avance real · trama roja = días de retraso · flecha = vínculo fin‑inicio (roja si la predecesora no ha terminado) · <b>PT</b> = autorización pendiente.</p></section>
  <div class="gantt ${S.zoom==='month'?'month':''}" style="--wkW:${7*dw}px;--wkS:${5*dw}px;--wkO:${(m0-r0)*dw}px">
   <div class="g-scroll">
    <div class="g-head" style="width:calc(var(--lw) + ${W}px)"><div class="g-left"><span>EDT</span><span>Actividad</span><span class="hx">Responsable</span><span class="hx">Inicio</span><span class="hx">Fin</span><span style="text-align:right">Avance</span><span class="hx" style="text-align:right">Retraso</span><span class="hx">Estado</span></div><div class="g-th" style="width:${W}px">${months}${subs}</div></div>
    <div style="position:relative" id="g-cuerpo">${rows||'<div class="empty"><b>Ninguna actividad coincide</b>Ajusta o limpia los filtros.</div>'}
      <svg class="g-arrows" id="g-arrows" style="left:var(--lw)" width="${W}" height="0" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker><marker id="ahc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--crit)"/></marker></defs><g id="g-paths"></g></svg>
      ${T>=r0&&T<=r1?`<div class="g-today" style="left:calc(var(--lw) + ${(T-r0)*dw+dw/2}px)"><b>HOY</b></div>`:''}
    </div>
   </div>
  </div>
  <section class="card"><div class="sec-h"><h2>Tabla de control ${MT('MOD-03.3')}</h2><div class="toolbar">${isViewer()?'':`<button class="btn sm" data-act="csv">Exportar CSV ${MT('MOD-03.6')}</button>`}${isAdmin()?'<button class="btn sm primary" data-act="task-new">+ Actividad</button>':''}</div></div>
   <div class="tw"><table class="tbl"><thead><tr><th>EDT</th><th>Actividad</th><th>Frente</th><th>Sede</th><th>Responsable</th><th>Contratista</th><th>Inicio plan</th><th>Fin plan</th><th>Días</th><th>Predecesoras</th><th>Inicio real</th><th>Fin real</th><th>Plan hoy</th><th>Real</th><th>Retraso</th><th>Estado</th></tr></thead>
   <tbody>${L.map(c=>`<tr class="click" data-act="task-edit" data-id="${esc(c.id)}"><td class="nw mono">${c.wbs}</td><td>${esc(c.t.name)}</td><td class="nw">${esc(c.t.front)}</td><td class="nw">${esc(c.t.site||'—')}</td><td class="nw">${esc(pname(c.t.respId))}</td><td class="nw">${esc(pname(c.t.contractorId))}</td><td class="nw">${fmt(c.t.start)}</td><td class="nw">${fmt(c.t.end)}</td><td class="n">${c.dur}</td><td class="nw mono">${c.preds.map(p=>C.map[p.id]?.wbs).join(', ')||'—'}</td><td class="nw">${fmt(c.t.actualStart)}</td><td class="nw">${fmt(c.t.actualEnd)}</td><td class="n">${c.planned}%</td><td class="n"><b>${c.prog}%</b></td><td class="n ${c.delay?'t-crit':''}">${c.delay?'+'+c.delay+' d':'—'}</td><td>${chip(c.st)}</td></tr>`).join('')}</tbody></table></div></section>`;
};

/* MOD-03.2 Vínculos: se miden las filas ya dibujadas porque su alto depende del largo del nombre */
function dibujarVinculos(){
  const cuerpo=document.getElementById('g-cuerpo'),svg=document.getElementById('g-arrows'),g=document.getElementById('g-paths');if(!cuerpo||!svg||!g)return;
  const yOf={};$$('.g-row',cuerpo).forEach(r=>{yOf[r.dataset.id]=r.offsetTop+r.offsetHeight/2});
  svg.setAttribute('height',cuerpo.scrollHeight);
  g.innerHTML=(S.g?.links||[]).filter(l=>yOf[l.from]!=null&&yOf[l.to]!=null).map(l=>{const y1=yOf[l.from],y2=yOf[l.to],{x1,x2}=l;
    const d=x2-x1>=12?`M${x1} ${y1} H${x1+6} V${y2} H${x2-1}`:`M${x1} ${y1} h6 V${y1+(y2>y1?20:-20)} H${x2-9} V${y2} H${x2-1}`;
    return `<path d="${d}" fill="none" stroke="${l.warn?'var(--crit)':'var(--muted)'}" stroke-width="1.3" marker-end="url(#${l.warn?'ahc':'ah'})" opacity=".8"/>`}).join('');
}
addEventListener('resize',()=>requestAnimationFrame(dibujarVinculos));

/* MOD-03.4 Formulario de actividad */
function descendants(id){const out=new Set(),q=[id];while(q.length){const x=q.shift();tasksRaw().forEach(t=>{if((t.deps||[]).includes(x)&&!out.has(t.id)){out.add(t.id);q.push(t.id)}})}return out}
function taskModal(t){
  const isNew=!t,fr=fronts(),c=t?C.map[t.id]:null;
  const v=t||{front:S.f.front||fr[0]||'',start:today(),end:ds(TD()+4),progress:0,deps:[],site:''};
  const desc=t?descendants(t.id):new Set();
  const depOpts=fr.map((f,i)=>{const cs=C.list.filter(x=>x.t.front===f&&x.id!==t?.id&&!desc.has(x.id));if(!cs.length)return '';return `<div class="g">${i+1}. ${esc(f)}</div>${cs.map(x=>`<label data-n="${esc((x.wbs+' '+x.t.name).toLowerCase())}"><input type="checkbox" value="${esc(x.id)}" ${(v.deps||[]).includes(x.id)?'checked':''}> <span class="mono small">${x.wbs}</span> ${esc(x.t.name)} <span class="muted small">(fin ${fmt(x.t.end)})</span></label>`).join('')}`}).join('');
  const logs=t?of('logs').filter(l=>l.taskId===t.id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))):[];
  const perms=t?of('permits').filter(p=>p.taskId===t.id):[];
  const eqs=t?of('equipment').filter(e=>e.taskId===t.id):[];
  const sug=t&&!isViewer()?suggestPermits(t).filter(ty=>!perms.some(p=>p.type===ty)):[];
  const body=`<div class="small muted">${MT('MOD-03.4')}</div><form class="frm" id="tf" novalidate>
    <div class="fld half"><label for="t_front">Frente de trabajo <i class="req">*</i></label><select id="t_front">${fr.map(f=>`<option ${f===v.front?'selected':''}>${esc(f)}</option>`).join('')}<option value="__new">+ Nuevo frente…</option></select><input id="t_front_new" placeholder="Nombre del nuevo frente" hidden></div>
    <div class="fld half"><label for="t_site">Sede</label><select id="t_site"><option value="">—</option>${SITES.map(s=>`<option ${s===v.site?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="fld full"><label for="t_name">Actividad <i class="req">*</i></label><input id="t_name" value="${esc(v.name)}" placeholder="Ej.: Instalación de acometida eléctrica en andén 10"></div>
    <div class="fld full"><label for="t_desc">Descripción / entregable</label><textarea id="t_desc" rows="2">${esc(v.desc)}</textarea></div>
    <div class="fld half"><label for="t_resp">Responsable <i class="req">*</i></label><select id="t_resp"><option value="">— Asignar —</option>${peopleOpts(v.respId)}</select></div>
    <div class="fld half"><label for="t_ctr">Contratista / proveedor</label><select id="t_ctr"><option value="">— Ninguno —</option>${peopleOpts(v.contractorId,'Contratista / Proveedor')}</select></div>
    <div class="fld half"><label for="t_start">Inicio planificado <i class="req">*</i></label><input type="date" id="t_start" value="${esc(v.start)}"></div>
    <div class="fld half"><label for="t_end">Fin planificado <i class="req">*</i></label><input type="date" id="t_end" value="${esc(v.end)}"><div class="hint" id="t_dur"></div></div>
    <div class="fld full"><label>Predecesoras (fin → inicio)</label><input id="t_depq" placeholder="Filtrar actividades…" style="margin-bottom:6px"><div class="deps" id="t_deps">${depOpts||'<span class="muted small">No hay otras actividades.</span>'}</div></div>
    <div class="fld full chk"><label><input type="checkbox" id="t_casc" checked> Si cambian las fechas, mover automáticamente las actividades que dependen de esta ${MT('MOD-03.5')}</label></div>
    ${isNew?'':`<div class="fld half"><label for="t_as">Inicio real</label><input type="date" id="t_as" value="${esc(v.actualStart)}"></div><div class="fld half"><label for="t_ae">Fin real</label><input type="date" id="t_ae" value="${esc(v.actualEnd)}"></div>
    <div class="fld full"><label for="t_prog">Avance actual (%)</label><input type="number" id="t_prog" min="0" max="100" value="${esc(v.progress||0)}"><div class="hint">El avance del día a día se reporta con «Registrar avance» para que quede en la bitácora.</div></div>`}
    <div class="fld full"><label for="t_notes">Notas / observaciones</label><textarea id="t_notes" rows="2">${esc(v.notes)}</textarea></div>
    <p class="err" id="ferr" hidden></p></form>
    ${t?`<div class="subsec"><h4>Estado: ${chip(c.st)} · plan a hoy ${c.planned}% · real ${c.prog}%${c.delay?` · <span class="t-crit">+${c.delay} días</span>`:''}</h4></div>
    ${sug.length?`<div class="subsec"><h4>Preparación de seguridad sugerida ${MT('MOD-05.6')}</h4><p class="hint" style="margin:0 0 6px">Seguridad Industrial emite el ATS y el PTS en sus formatos. Para este trabajo probablemente se requiera:</p><div class="list">${sug.map(ty=>`<div class="li"><div class="body"><div class="t">${esc(ty)}</div></div><div class="r"><button class="btn sm" data-act="permit-new" data-id="${esc(t.id+'|'+ty)}">Planificar</button></div></div>`).join('')}</div></div>`:''}
    <div class="subsec"><h4>Autorizaciones (${perms.length})</h4>${perms.length?`<div class="list">${perms.map(p=>`<div class="li click" data-act="permit-edit" data-id="${esc(p.id)}"><span class="chip ${PERMIT_CLS[p.status]}">${esc(p.status)}</span><div class="body"><div class="t">${esc(p.type)}</div><div class="m">${fmtY(p.date)} · ${esc(p.title)} · preparación ${prepPct(p)}%</div></div></div>`).join('')}</div>`:'<p class="hint">Sin autorizaciones.</p>'}</div>
    ${eqs.length?`<div class="subsec"><h4>Equipos vinculados</h4><div class="list">${eqs.map(e=>`<div class="li click" data-act="eq-edit" data-id="${esc(e.id)}"><span class="chip ${EQ_CLS[e.status]||'idle'}">${esc(e.status)}</span><div class="body">${esc(e.tag?e.tag+' · ':'')}${esc(e.name)}</div></div>`).join('')}</div></div>`:''}
    <div class="subsec"><h4>Bitácora (${logs.length})</h4>${logs.length?`<div class="list">${logs.map(registroLi).join('')}</div>`:'<p class="hint">Sin reportes de avance.</p>'}</div>`:''}`;
  const foot=`${!isNew?'<button class="btn danger" id="fdel">Eliminar</button>':''}<span class="sp"></span><span class="small muted" id="fmsg"></span>${!isNew?`<button class="btn" data-act="log-new" data-id="${esc(t.id)}">Registrar avance</button>`:''}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">Guardar</button>`;
  modal(isNew?'Nueva actividad':`${c.wbs} · Actividad`,body,foot,m=>{
    const fs=$('#t_front'),fn=$('#t_front_new');fs.onchange=()=>{fn.hidden=fs.value!=='__new';if(!fn.hidden)fn.focus()};if(!fr.length){fs.value='__new';fn.hidden=false}
    const upd=()=>{const a=dn($('#t_start').value),b=dn($('#t_end').value);$('#t_dur').textContent=a!=null&&b!=null?(b>=a?`Duración: ${b-a+1} días calendario`:'El fin debe ser posterior al inicio'):''};
    $('#t_start').onchange=()=>{const a=dn($('#t_start').value),b=dn($('#t_end').value);if(a!=null&&(b==null||b<a))$('#t_end').value=ds(a+(t?c.dur-1:4));upd()};$('#t_end').onchange=upd;upd();
    $('#t_depq').oninput=e=>{const q=e.target.value.toLowerCase();$$('#t_deps label').forEach(l=>l.hidden=q&&!l.dataset.n.includes(q))};
    $('#fsave').onclick=async()=>{
      const front=fs.value==='__new'?fn.value.trim():fs.value,name=$('#t_name').value.trim(),start=$('#t_start').value,end=$('#t_end').value,respId=$('#t_resp').value;
      if(!front)return showErr('Indica el frente de trabajo.');if(!name)return showErr('Escribe el nombre de la actividad.');if(!start||!end)return showErr('Indica inicio y fin planificados.');if(dn(end)<dn(start))return showErr('El fin planificado no puede ser anterior al inicio.');if(!respId)return showErr('Asigna un responsable.');
      const data={...(t||{}),projectId:S.pid,front,site:$('#t_site').value,name,desc:$('#t_desc').value.trim(),respId,contractorId:$('#t_ctr').value,start,end,deps:$$('#t_deps input:checked').map(x=>x.value),notes:$('#t_notes').value.trim()};
      delete data.id;
      if(!isNew){data.actualStart=$('#t_as').value||null;data.actualEnd=$('#t_ae').value||null;data.progress=Math.max(0,Math.min(100,+$('#t_prog').value||0));if(data.progress>=100&&!data.actualEnd)data.actualEnd=today();if(data.progress<100)data.actualEnd=null}
      else{data.progress=0;data.createdAt=nowISO();data.createdByEmail=S.session?.email||''}
      if(isNew||t.front!==front)data.order=Math.max(0,...tasksRaw().filter(x=>x.front===front).map(x=>x.order||0))+10;
      busy(true,'Guardando…');let moved=0;
      try{const id=t?.id||uid('tsk');
        const ok=await authorize(isNew?`Crear la actividad «${name}»`:`Modificar la actividad ${c.wbs} «${name}»`,async db=>{
          const p=proj();if(!(p.fronts||[]).includes(front))await patch('projects',p.id,{fronts:[...fronts().filter(f=>f!==front),front]},db);
          await save('tasks',id,data,db);if($('#t_casc').checked)moved=await cascade(id,{...data,id},db)});
        if(!ok){busy(false);return}
        closeModal();toast((isNew?'Actividad creada':'Actividad actualizada')+(moved?` · ${moved} vinculada(s) reprogramada(s)`:''))}
      catch(e){busy(false);showErr(errMsg(e))}};
    armDelete($('#fdel'),()=>authorize(`Eliminar la actividad ${c.wbs} «${t.name}»`,async db=>{for(const x of tasksRaw())if((x.deps||[]).includes(t.id))await patch('tasks',x.id,{deps:x.deps.filter(d=>d!==t.id)},db);await removeDoc('tasks',t.id,db)}));
    if(isViewer())readonly(m);
  },true);
}
/* MOD-03.5 Reprogramación por vínculos */
async function cascade(rootId,override,db){
  const ts=Object.fromEntries(tasksRaw().map(t=>[t.id,{...t}]));ts[rootId]={...ts[rootId],...override};
  const changed=new Set(),q=[rootId];let guard=0;
  while(q.length&&guard++<2000){const id=q.shift();for(const t of Object.values(ts)){if(!(t.deps||[]).includes(id)||(+t.progress||0)>=100||t.actualStart)continue;
    const req=Math.max(...t.deps.map(d=>ts[d]?dn(ts[d].end)+1:-1e9)),s=dn(t.start);if(s<req){const d=req-s;t.start=ds(s+d);t.end=ds(dn(t.end)+d);changed.add(t.id);q.push(t.id)}}}
  for(const id of changed)await patch('tasks',id,{start:ts[id].start,end:ts[id].end},db);
  return changed.size;
}
/* MOD-03.6 Exportar CSV */
function exportarCSV(){
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=[['EDT','Frente','Actividad','Sede','Responsable','Contratista','Inicio plan','Fin plan','Duracion (d)','Predecesoras','Inicio real','Fin real','Avance plan %','Avance real %','Retraso (d)','Estado','Notas']]
   .concat(C.list.map(c=>[c.wbs,c.t.front,c.t.name,c.t.site||'',pname(c.t.respId),pname(c.t.contractorId),c.t.start,c.t.end,c.dur,c.preds.map(p=>C.map[p.id]?.wbs).join(' '),c.t.actualStart||'',c.t.actualEnd||'',c.planned,c.prog,c.delay,ST[c.st][0],c.t.notes||'']));
  descargar(`Cronograma_${slug(proj()?.code||proj()?.name)}_${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
Object.assign(ACT,{
  'task-new':()=>{if(!isAdmin())toast('Crear actividades requiere la autorización del administrador.');taskModal(null)},
  'task-edit':id=>{const t=C.by[id];if(t)taskModal(t)},
  zoom:z=>{S.zoom=z;lsSet('cp-zoom',z);S.gToday=true;render()},

  'deps-toggle':()=>{S.showDeps=!S.showDeps;render()},
  'group-toggle':f=>{S.collapsed[f]=!S.collapsed[f];render()},
  'collapse-all':()=>{const any=Object.values(S.collapsed).some(Boolean);S.collapsed={};if(!any)fronts().forEach(f=>S.collapsed[f]=true);render()},
  'filter-clear':()=>{S.f={front:'',resp:'',site:'',status:'',q:''};render()},
  csv:()=>exportarCSV(),
});

<script>
/* ===== js/mod04-avances.js ===== */
/* =====================================================================

VIEWS_LIST.push(['avances','Avances en campo',3]);

/* MOD-04.1 y MOD-04.3 */
VIEWS.avances=function(){

  const ord={late:0,blocked:1,risk:2,active:3,pending:4};cs.sort((a,b)=>ord[a.st]-ord[b.st]||a.e-b.e);
  const lastLog={};of('logs').forEach(l=>{if(!lastLog[l.taskId]||String(l.createdAt)>String(lastLog[l.taskId].createdAt))lastLog[l.taskId]=l});

  ${cs.length?`<div class="tcards">${cs.map(c=>{const ll=lastLog[c.id];return `<article class="tcard" style="--c:${fcol(c.fi)}">
     <div class="top"><div><div class="meta mono">${c.wbs} · ${esc(c.t.front)}</div><div class="nm">${esc(c.t.name)}</div></div>${chip(c.st)}</div>
     <div class="meta">${esc(pname(c.t.respId))}${c.t.site?' · '+esc(c.t.site):''}<br>Plan: ${fmt(c.t.start)} → ${fmt(c.t.end)}${c.delay?` · <b class="t-crit">+${c.delay} días</b>`:''}</div>
     <div class="pv"><div class="meter"><span style="width:${c.prog}%"></span><i style="left:${c.planned}%"></i></div><b>${c.prog}%</b></div>
     <div class="meta">${ll?`Último reporte ${fmt(ll.date)}: ${esc(String(ll.note||'').slice(0,90))}`:'Sin reportes aún'}</div>
     <button class="btn primary" data-act="log-new" data-id="${esc(c.id)}">Registrar avance</button></article>`}).join('')}</div>`
   :`<div class="card empty"><b>Nada pendiente en esta vista</b>${mode==='mine'?'No tienes actividades asignadas como responsable. Revisa «Esta semana» o «Todas pendientes».':'Cambia el filtro para ver otras actividades.'}</div>`}
  <section class="card"><div class="sec-h"><h2>Bitácora de avances ${MT('MOD-04.3')}</h2><span class="muted small">${logs.length} registros</span></div>
   ${logs.length?`<div class="list">${logs.slice(0,S.feedAll?1000:30).map(l=>isAdmin()?`<div style="position:relative">${registroLi(l)}<button class="btn sm" style="position:absolute;right:0;top:8px" data-act="log-edit" data-id="${esc(l.id)}">Corregir</button></div>`:registroLi(l)).join('')}</div>${logs.length>30&&!S.feedAll?'<button class="btn sm" data-act="feed-all">Ver todos los registros</button>':''}`:'<div class="empty"><b>Sin registros</b>El primer avance aparecerá aquí.</div>'}</section>`;
};

/* MOD-04.2 Registro de avance */
function logModal(taskId){
  if(!C.list.length)return toast('Primero el administrador debe cargar actividades al cronograma.');
  const pre=taskId||'';
  const body=`<div class="small muted">${MT('MOD-04.2')}</div><form class="frm" id="lf" novalidate>
   <div class="fld full"><label for="l_task">Actividad <i class="req">*</i></label><select id="l_task"><option value="">Selecciona la actividad…</option>${taskOpts(pre,c=>c.st!=='done'||c.id===pre)}</select><div class="hint" id="l_info"></div></div>
   <div class="fld half"><label>Reporta</label><div style="padding:9px 0;font-weight:600">${esc(S.session?.name||'—')}</div></div>
   <div class="fld half"><label for="l_date">Fecha del trabajo</label><input type="date" id="l_date" value="${today()}" max="${today()}"></div>
   <div class="fld full"><label for="l_pn">Avance acumulado de la actividad (%) <i class="req">*</i></label><div class="prog"><input type="range" id="l_pr" min="0" max="100" step="5" aria-label="Avance"><input type="number" id="l_pn" min="0" max="100"></div>
     <div class="quick">${[10,25,50,75,90,100].map(n=>`<button type="button" class="btn sm" data-q="${n}">${n===100?'Terminada 100%':n+'%'}</button>`).join('')}</div></div>
   <div class="fld full"><label for="l_note">Trabajo realizado <i class="req">*</i></label><textarea id="l_note" rows="4" placeholder="Qué se hizo, cantidades (tomas, metros, equipos), quién intervino, pendientes para el siguiente día"></textarea></div>
   <div class="fld full chk"><label><input type="checkbox" id="l_iss"> Reportar incidencia o bloqueo (falta de material, permiso, acceso, condición insegura) ${MT('MOD-04.4')}</label></div>
   <div class="fld full" id="l_issw" hidden><label for="l_issT">Describe la incidencia</label><textarea id="l_issT" rows="2"></textarea></div>
   <p class="hint" style="grid-column:1/-1;margin:0">No se adjuntan fotos ni documentos: describe el avance con el detalle suficiente para que otro técnico lo entienda.</p>
   <p class="err" id="ferr" hidden></p></form>`;
  modal('Registrar avance',body,`<span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">Guardar avance</button>`,m=>{
    const setP=n=>{n=Math.max(0,Math.min(100,Math.round(+n||0)));$('#l_pr').value=n;$('#l_pn').value=n};
    const info=()=>{const c=C.map[$('#l_task').value];$('#l_info').innerHTML=c?`Actual: <b>${c.prog}%</b> · plan a hoy ${c.planned}% · fin ${fmt(c.t.end)} · responsable ${esc(pname(c.t.respId))}`:'';if(c)setP(c.prog)};
    $('#l_task').onchange=info;info();
    $('#l_pr').oninput=e=>$('#l_pn').value=e.target.value;$('#l_pn').oninput=e=>$('#l_pr').value=e.target.value;
    m.querySelector('.quick').onclick=e=>{const b=e.target.closest('[data-q]');if(b)setP(b.dataset.q)};
    $('#l_iss').onchange=e=>$('#l_issw').hidden=!e.target.checked;
    $('#fsave').onclick=async()=>{
      const tid=$('#l_task').value,c=C.map[tid],prog=Math.max(0,Math.min(100,Math.round(+$('#l_pn').value||0))),note=$('#l_note').value.trim(),date=$('#l_date').value||today();
      if(!c)return showErr('Selecciona la actividad.');if(!note)return showErr('Describe el trabajo realizado.');if(note.length<15)return showErr('Amplía la descripción del trabajo realizado (mínimo 15 caracteres).');
      const iss=$('#l_iss').checked,issT=$('#l_issT').value.trim();if(iss&&!issT)return showErr('Describe la incidencia.');

        const up={progress:prog,actualEnd:prog>=100?(c.t.actualEnd||date):null};if(!c.t.actualStart&&prog>0)up.actualStart=date;
        await patch('tasks',tid,up);closeModal();toast(prog>=100?'Actividad cerrada al 100%':'Avance registrado: '+prog+'%')}
      catch(e){busy(false);showErr(errMsg(e))}};

/* MOD-04.5 Corrección de registros (solo administrador) */
function ultimoRegistro(taskId,excluir){return of('logs').filter(l=>l.taskId===taskId&&l.id!==excluir).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt).localeCompare(String(a.createdAt)))[0]}
function logEditModal(l){
  if(!isAdmin())return;const c=C.map[l.taskId];const esUltimo=!ultimoRegistro(l.taskId,null)||ultimoRegistro(l.taskId,null).id===l.id;
  modal('Corregir registro de avance',`<div class="small muted">${MT('MOD-04.5')}</div><p class="small" style="margin:0"><b>${esc(tlabel(l.taskId))}</b> · registrado por ${esc(pname(l.personId))} el ${fmtY(l.date)}</p>
   <form class="frm" novalidate>
    <div class="fld half"><label for="le_date">Fecha del trabajo</label><input type="date" id="le_date" value="${esc(l.date)}"></div>
    <div class="fld half"><label for="le_prog">Avance acumulado (%)</label><input type="number" id="le_prog" min="0" max="100" value="${esc(l.progress)}"></div>
    <div class="fld full"><label for="le_note">Trabajo realizado</label><textarea id="le_note" rows="4">${esc(l.note)}</textarea></div>
    <div class="fld full chk"><label><input type="checkbox" id="le_iss" ${l.issue?'checked':''}> Incidencia o bloqueo</label></div>
    <div class="fld full"><label for="le_issT">Descripción de la incidencia</label><textarea id="le_issT" rows="2">${esc(l.issueText)}</textarea></div>
    <div class="fld full chk"><label><input type="checkbox" id="le_res" ${l.issueResolved?'checked':''}> Incidencia resuelta</label></div>
    <div class="fld full chk"><label><input type="checkbox" id="le_sync" ${esUltimo?'checked':''}> Actualizar el avance de la actividad con el último registro (recomendado)</label></div>
    <div class="fld full"><label for="le_why">Motivo de la corrección <i class="req">*</i></label><input id="le_why" placeholder="Ej.: el técnico registró 60 % en lugar de 40 %"></div>
    <p class="err" id="ferr" hidden></p></form>`,
   `<button class="btn danger" id="fdel">Eliminar registro</button><span class="sp"></span><span class="small muted" id="fmsg"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="fsave">Guardar corrección</button>`,()=>{
    const sync=async()=>{if(!$('#le_sync').checked||!c)return;const u=ultimoRegistro(l.taskId,null);const prog=u?+u.progress||0:0;
      await patch('tasks',l.taskId,{progress:prog,actualEnd:prog>=100?(u.date||today()):null,actualStart:prog>0?(c.t.actualStart||u?.date||null):null})};
    $('#fsave').onclick=async()=>{const why=$('#le_why').value.trim();if(!why)return showErr('Indica el motivo de la corrección: queda en la auditoría.');
      const prog=Math.max(0,Math.min(100,Math.round(+$('#le_prog').value||0))),note=$('#le_note').value.trim();if(!note)return showErr('El trabajo realizado no puede quedar vacío.');
      busy(true,'Guardando…');
      try{const iss=$('#le_iss').checked;await patch('logs',l.id,{date:$('#le_date').value||l.date,progress:prog,note,issue:iss,issueText:iss?$('#le_issT').value.trim():'',issueResolved:iss&&$('#le_res').checked,correctedBy:S.session?.personId||'',correctedAt:nowISO(),correctionReason:why});
        l.progress=prog;l.date=$('#le_date').value||l.date;const ix=S.data.logs.findIndex(x=>x.id===l.id);if(ix>=0)Object.assign(S.data.logs[ix],{progress:prog,date:l.date});
        await sync();await audit('Registro de avance corregido',`${tlabel(l.taskId)} · ${why}`);closeModal();toast('Registro corregido')}
      catch(e){busy(false);showErr(errMsg(e))}};
    armDelete($('#fdel'),async()=>{const why=$('#le_why').value.trim();if(!why)throw new Error('Indica el motivo antes de eliminar: queda en la auditoría.');
      await removeDoc('logs',l.id);S.data.logs=S.data.logs.filter(x=>x.id!==l.id);await sync();await audit('Registro de avance eliminado',`${tlabel(l.taskId)} · ${fmt(l.date)} · ${why}`)});
  },true);
}
Object.assign(ACT,{
  'log-edit':id=>{const l=S.data.logs.find(x=>x.id===id);l&&logEditModal(l)},
  'log-new':id=>logModal(id),
  'tech-mode':m=>{S.techMode=m;render()},
  'feed-all':()=>{S.feedAll=true;render()},
  'issue-resolve':async id=>{try{await patch('logs',id,{issueResolved:true,issueResolvedAt:today(),issueResolvedBy:S.session?.personId||''});toast('Incidencia marcada como resuelta')}catch(e){toast(errMsg(e))}},
});

 'Permiso de trabajo eléctrico (LOTO / NFPA 70E)':['Diagrama unifilar y punto de conexión identificados','Kit de bloqueo y etiquetado: candados personales, tarjetas y pinza multibloqueo','Detector de tensión / multímetro CAT III–IV verificado antes y después','Ropa y EPP según categoría de riesgo de arco (NFPA 70E)','Herramienta aislada 1000 V inspeccionada','Personal calificado con certificado de competencia en riesgo eléctrico','Extintor de CO₂ junto al tablero','Plan de reconexión y pruebas: aislamiento, continuidad, torque y protección diferencial'],
 'Permiso de trabajo en altura':['Certificado vigente de trabajo en altura del personal','Arnés de cuerpo completo, línea de vida y anclaje certificados (inspección pre-uso)','Andamio certificado, escalera en buen estado o plataforma con operador certificado','Plan de rescate en altura definido','Área inferior delimitada (caída de objetos)'],
 'Permiso de trabajo en caliente':['Extintor PQS a mano y vigía de fuego asignado','Combustibles retirados o protegidos con mantas ignífugas en el radio de trabajo','Coordinación con la brigada si se aíslan detectores o rociadores de la zona','Vigilancia posterior al trabajo según NFPA 51B','Equipo de soldadura/corte inspeccionado'],
 'Permiso de trabajo general':['Herramientas y equipos inspeccionados','Protección de producto y áreas vecinas (polvo, escombros)','Plan de retiro de escombros y limpieza diaria','Orden y limpieza al cierre de jornada'],
 'Ingreso de proveedor / contratista':['Planilla de aportes al IESS al día del personal','Listado de personal con cédula y cargo','Inducción de seguridad de la empresa recibida','Certificados de competencia según el trabajo (eléctrico, altura, soldadura)','Póliza de responsabilidad civil (si el contrato la exige)','Listado de herramientas y equipos que ingresan'],
 'Corte de servicio (energía, frío, CCTV, acceso)':['Comunicación previa a áreas afectadas (Operaciones, Calidad, Seguridad física)','Plan de contingencia: producto reubicado o monitoreo de temperatura de cuartos fríos','Horario de menor operación acordado','Responsable de restablecer y probar el servicio'],
 'Otro':[]
};
const prepList=type=>[...PREP_COMMON,...(PREP[type]||[])];
const prepPct=p=>{const L=prepList(p.type),c=p.prep||{};return L.length?Math.round(L.filter(x=>c[x]).length/L.length*100):0};
const prepBar=p=>{const v=prepPct(p);return `<span class="prepbar" title="Preparación ATS/PTS"><span class="meter sm"><span style="width:${v}%;background:${v>=100?'var(--ok)':'var(--warn)'}"></span></span>${v}%</span>`};

/* MOD-05.6 Sugerencias según la actividad */
function suggestPermits(t){const s=(t.name+' '+(t.desc||'')).toLowerCase(),o=new Set();
  if(/acometida|toma|tablero|eléctric|electric|lámpara|lampara|ilumin|horno/.test(s))o.add('Permiso de trabajo eléctrico (LOTO / NFPA 70E)');
  if(/lámpara|lampara|cámara|camara|pared|techo|rociador|incendio|anclaje|gypsum/.test(s))o.add('Permiso de trabajo en altura');
  if(/incendio|extinción|extincion|soldadura|anclaje/.test(s))o.add('Permiso de trabajo en caliente');
  if(/andén|anden|secado de camiones|equipos de secado|tomas/.test(s))o.add('Liberación de andén');
  if(/cuartos fríos|cuartos frios|pared refrigerada|cfr|acceso|acometida/.test(s))o.add('Corte de servicio (energía, frío, CCTV, acceso)');
  if(/puerta|pared|gypsum|ventana/.test(s))o.add('Permiso de trabajo general');
  if(t.contractorId)o.add('Ingreso de proveedor / contratista');
  return [...o]}

/* MOD-05.1 a MOD-05.4 */

  <div class="grid2">

    ${ag.length?Object.entries(byDay).map(([d,ps])=>`<div style="margin-bottom:10px"><div class="eyebrow">${fmtY(d)} · ${DIAS[dow(dn(d))]}</div><div class="list">${ps.map(p=>`<div class="li click" data-act="permit-edit" data-id="${esc(p.id)}"><span class="chip ${PERMIT_CLS[p.status]}">${esc(p.status)}</span><div class="body"><div class="t">${esc(p.type)}</div><div class="m">${esc(p.title)}${p.area?' · '+esc(p.area):''}${p.supplierId?' · '+esc(pname(p.supplierId)):''}</div></div><div class="r"><div class="mono">${esc(p.from||'')}${p.to?'–'+esc(p.to):''}</div>${prepBar(p)}</div></div>`).join('')}</div></div>`).join(''):'<div class="empty"><b>Sin autorizaciones próximas</b>Planifica liberaciones de andén, permisos de trabajo e ingresos de proveedores.</div>'}
   </section>
   <section class="card guide"><h2>Flujo de control con Seguridad Industrial ${MT('MOD-05.3')}</h2><ol class="small">
    <li><b>Preparar:</b> abre la autorización y marca la lista de preparación; así se llega a Seguridad Industrial con lo que pedirá para emitir el ATS y el PTS.</li>

  </div>
  <section class="card"><h2>Qué tener listo para cada tipo de trabajo</h2><p class="hint" style="margin:0 0 8px">Siempre aplican los puntos comunes más los del tipo de trabajo.</p>

    <select data-pf="status" aria-label="Estado"><option value="">Todos los estados</option>${PERMIT_ST.map(t=>`<option ${S.pf.status===t?'selected':''}>${t}</option>`).join('')}</select>
    <button class="btn sm primary" data-act="permit-new">+ Autorización</button></div></div>
   ${L.length?`<div class="tw"><table class="tbl"><thead><tr><th>Fecha</th><th>Horario</th><th>Tipo</th><th>Trabajo</th><th>Área</th><th>Actividad</th><th>Proveedor</th><th>Aprueba</th><th>Preparación</th><th>Estado</th></tr></thead><tbody>
   ${L.map(p=>`<tr class="click" data-act="permit-edit" data-id="${esc(p.id)}"><td class="nw">${fmtY(p.date)}${['Planificado','Solicitado'].includes(p.status)&&dn(p.date)<T?' <span class="chip crit">Vencida</span>':''}</td><td class="nw mono">${esc(p.from||'')}${p.to?'–'+esc(p.to):''}</td><td>${esc(p.type)}</td><td>${esc(p.title)}</td><td class="nw">${esc(p.area||'—')}</td><td>${esc(p.taskId?tlabel(p.taskId):'—')}</td><td class="nw">${esc(pname(p.supplierId))}</td><td class="nw">${esc(pname(p.approverId))}</td><td class="n">${prepBar(p)}</td><td><span class="chip ${PERMIT_CLS[p.status]||'idle'}">${esc(p.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>Sin registros</b>Ninguna autorización coincide con el filtro.</div>'}</section>`;
};

  {k:'prep',l:'Preparación para el ATS / PTS de Seguridad Industrial',t:'prep'},{k:'atsCode',l:'N.º de ATS / PTS emitido por Seguridad Industrial',t:'text',half:1},{k:'crew',l:'Personal autorizado (nombres)',t:'textarea'},{k:'controls',l:'Controles adicionales acordados con Seguridad Industrial',t:'textarea'},{k:'notes',l:'Observaciones',t:'textarea'}],

<script>
/* ===== js/mod07-cambios.js ===== */
/* =====================================================================
   MOD-07 · CONTROL DE CAMBIOS DEL PROYECTO
